ltétel (90 >= 40) igaz, így a program sosem jut el az ötös ághoz. A szigorúbb feltétellel kell kezdeni!","id":"e8e3f1e9"},{"ch":4,"tp":"elif","t":"mc","q":"Mit jelent az elif?","o":["else if – különben ha","else + if külön sorban","elágazás vége","end if"],"a":0,"why":"Az elif a „különben ha” rövidítése: újabb feltétel, ha az előzők hamisak voltak.","id":"435ce392"},{"ch":4,"tp":"elif","t":"mc","q":"Az if–elif–else láncban melyik ág fut le, ha több feltétel is igaz?","o":["Az első igaz feltételhez tartozó","Az utolsó igaz","Mindegyik igaz","Az else"],"a":0,"why":"Az első igaz ág „győz”, a többit a gép meg sem vizsgálja.","id":"85e75149"},{"ch":4,"tp":"elif","t":"tf","q":"Az elif láncban a feltételek sorrendje nem számít.","a":false,"why":"Nagyon is számít! Mindig a legszűkebb (legszigorúbb) feltétellel kezdj.","id":"496a9904"},{"ch":4,"tp":"elif","t":"tf","q":"Az else ág elhagyható, és ha van, mindig az utolsó.","a":true,"why":"Az else azokra az esetekre vonatkozik, amikor egyik feltétel sem volt igaz.","id":"19b9e906"},{"ch":4,"tp":"elif","t":"out","q":"Mit ír ki?","code":"x = 0\nif x > 0:\n    print(\"pozitív\")\nelif x < 0:\n    print(\"negatív\")\nelse:\n    print(\"nulla\")","o":["nulla","pozitív","negatív","Semmit"],"a":0,"why":"Egyik feltétel sem igaz, így az else fut.","id":"204df816"},{"ch":4,"tp":"elif","t":"out","q":"Mit ír ki?","code":"x = 15\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")","o":["A\nB","A","B","Semmit"],"a":0,"why":"Itt KÉT külön if van (nem elif), ezért mindkettő külön vizsgálódik, és mindkettő igaz.","id":"c6d8fe95"},{"ch":4,"tp":"elif","t":"out","q":"Mit ír ki?","code":"x = 15\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")","o":["A","A\nB","B","Semmit"],"a":0,"why":"Az elif csak akkor vizsgálódik, ha az előző hamis volt. Az első igaz → csak A.","id":"68227acd"},{"ch":4,"tp":"elif","t":"mc","q":"Melyik szerkezet hasonlít az elif-láncra más nyelvekben (C, Java)?","o":["switch","for","do … while","try"],"a":0,"why":"A switch több esetet választ szét; Pythonban 3.10 óta van hasonló match utasítás.","id":"d336a1ca"},{"ch":4,"tp":"beagyazott","t":"out","q":"Mit ír ki?","code":"esik = True\nvan_esernyo = False\nif esik:\n    if van_esernyo:\n        print(\"Esernyővel indulok.\")\n    else:\n        print(\"Otthon maradok.\")\nelse:\n    print(\"Elmegyek sétálni.\")","o":["Otthon maradok.","Esernyővel indulok.","Elmegyek sétálni.","Semmit"],"a":0,"why":"Esik → belső elágazás; nincs esernyő → belső else.","id":"4fd6f206"},{"ch":4,"tp":"beagyazott","t":"out","q":"Mit ír ki?","code":"esik = False\nvan_esernyo = True\nif esik:\n    if van_esernyo:\n        print(\"Esernyővel indulok.\")\n    else:\n        print(\"Otthon maradok.\")\nelse:\n    print(\"Elmegyek sétálni.\")","o":["Elmegyek sétálni.","Esernyővel indulok.","Otthon maradok.","Semmit"],"a":0,"why":"Nem esik → a külső else fut; a belső elágazásig el sem jut.","id":"632c16ec"},{"ch":4,"tp":"beagyazott","t":"mc","q":"Egymásba ágyazott elágazásnál mi mutatja meg, melyik else melyik if-hez tartozik?","o":["A behúzás","A sorrend","A zárójelek","A megjegyzések"],"a":0,"why":"Az else ugyanannyira van behúzva, mint a hozzá tartozó if.","id":"2cdea8a3"},{"ch":4,"tp":"beagyazott","t":"fill","q":"A beágyazott változat laposítva. Mi kerül a helyére?","code":"esik = True\nvan_esernyo = True\nif esik ___ van_esernyo:\n    print(\"Esernyővel indulok.\")\nelif esik:\n    print(\"Otthon maradok.\")\nelse:\n    print(\"Elmegyek sétálni.\")","o":["and","or","not","=="],"a":0,"why":"Esernyővel csak akkor indulunk, ha esik ÉS van esernyő.","id":"54f508c1"},{"ch":4,"tp":"beagyazott","t":"mc","q":"Mit érdemes tenni, ha már 3–4 szint mélyen vannak az elágazások?","o":["Átgondolni, nem lehet-e egyszerűbben, logikai operátorokkal vagy elif-fel","Még több szintet használni","Kitörölni a behúzásokat","Mindent else ágba tenni"],"a":0,"why":"Egy-két szint még olvasható, a mélyebb szerkezetet érdemes laposítani.","id":"a736be46"},{"ch":4,"tp":"szokoev","t":"out","q":"Mit ír ki?","code":"ev = 1900\nif (ev % 4 == 0 and ev % 100 != 0) or ev % 400 == 0:\n    print(ev, \"szökőév.\")\nelse:\n    print(ev, \"nem szökőév.\")","o":["1900 nem szökőév.","1900 szökőév.","Hiba","Semmit"],"a":0,"why":"Osztható 4-gyel, de 100-zal is (bal rész hamis), 400-zal nem (jobb rész hamis).","id":"ba6b7dea"},{"ch":4,"tp":"szokoev","t":"out","q":"Mit ír ki?","code":"ev = 2000\nif (ev % 4 == 0 and ev % 100 != 0) or ev % 400 == 0:\n    print(ev, \"szökőév.\")\nelse:\n    print(ev, \"nem szökőév.\")","o":["2000 szökőév.","2000 nem szökőév.","Hiba","Semmit"],"a":0,"why":"A 2000 osztható 400-zal, így az or jobb oldala igaz.","id":"72fec7be"},{"ch":4,"tp":"szokoev","t":"mc","q":"Szökőév-e 2026?","o":["Nem, mert nem osztható 4-gyel","Igen, mert páros","Igen, mert osztható 2-vel","Nem, mert osztható 100-zal"],"a":0,"why":"2026 % 4 = 2, így már az első feltétel hamis.","id":"1ad0ef07"},{"ch":4,"tp":"szokoev","t":"mc","q":"Szökőév-e 2024?","o":["Igen","Nem"],"a":0,"why":"Osztható 4-gyel, 100-zal nem → szökőév.","id":"73e5a5d1"},{"ch":4,"tp":"folyamat","t":"mc","q":"Melyik alakzat jelöli a folyamatábrán a feltételt (döntést)?","o":["Rombusz","Téglalap","Ovális","Paralelogramma"],"a":0,"why":"A rombuszból igen és nem ág vezet tovább.","id":"e11801e6"},{"ch":4,"tp":"folyamat","t":"mc","q":"Mit jelöl a folyamatábrán az ovális?","o":["A program elejét és végét","Egy feltételt","Adat bekérését","Egy számolást"],"a":0,"why":"Start és Vége: ovális.","id":"ff1ce667"},{"ch":4,"tp":"folyamat","t":"mc","q":"Mit jelöl a folyamatábrán a paralelogramma?","o":["Be- vagy kiírást","Feltételt","Program végét","Értékadást"],"a":0,"why":"Adat bekérése vagy kiírása: paralelogramma. Tevékenység, számolás: téglalap.","id":"87d5dcbc"},{"ch":4,"tp":"if","t":"bug","q":"Melyik sorban van a hiba? (A felhasználó számot ír be.)","code":"kor = input(\"Hány éves vagy? \")\nif kor >= 18:\n    print(\"Felnőtt\")","a":0,"fix":"kor = int(input(\"Hány éves vagy? \"))","why":"Az input szöveget ad; szöveget számmal nem lehet >=-vel összehasonlítani (TypeError). Előbb int()-tel alakítsd át.","id":"2c2e4c6c"},{"ch":4,"tp":"if","t":"fill","q":"Mi kerül a helyére, hogy a 0 is „nem negatív” legyen?","code":"x = 0\nif x ___ 0:\n    print(\"nem negatív\")","o":[">=",">","==","<"],"a":0,"why":"A nagyobb vagy egyenlő (>=) a 0-t is beleérti.","id":"9cdd14d8"},{"ch":4,"tp":"elif","t":"order","q":"Rakd sorrendbe a hőmérséklet-figyelőt (első igaz ág győz)!","lines":["fok = 28","if fok >= 30:","    print(\"Kánikula\")","elif fok >= 20:","    print(\"Meleg\")","else:","    print(\"Hűvös\")"],"why":"A szigorúbb feltétellel (>= 30) kell kezdeni, különben a 35 fokra is „Meleg”-et írna.","id":"9ad9ec74"},{"ch":4,"tp":"if","t":"exp","q":"Miért fontos Pythonban a behúzás? Mit történne, ha a print(\"Jó utat!\") sort is behúznád az if alá?","model":"A behúzás határozza meg, mely sorok tartoznak az if-hez (blokk). Ha a „Jó utat!” is be lenne húzva, csak akkor futna le, ha a feltétel igaz – meleg időben semmit nem írna ki a program.","id":"944fe522"},{"ch":4,"tp":"elif","t":"exp","q":"Miért kapott 2-est a 90 pontos dolgozat a rossz sorrendű elif-láncban?","model":"Mert a lánc a pont >= 40 feltétellel kezdődött, ami a 90-re is igaz. Az első igaz ág lefut, a többit a program meg sem nézi, így el sem jutott a pont >= 85 ághoz. Mindig a legszűkebb feltétellel kell kezdeni.","id":"d58930e2"},{"ch":4,"tp":"szokoev","t":"exp","q":"Fogalmazd meg szavakkal a szökőév szabályát, ahogy a feltétel leírja!","model":"Szökőév, ha osztható 4-gyel, de nem osztható 100-zal; VAGY ha osztható 400-zal. Pythonban: (ev % 4 == 0 and ev % 100 != 0) or ev % 400 == 0.","id":"b54d880a"},{"ch":5,"tp":"alap","t":"card","front":"Ciklus","back":"Programszerkezet, amelyben egy utasításcsoportot (a ciklus törzsét) többször egymás után végrehajtunk, amíg egy feltétel teljesül.","id":"2ae91cc4"},{"ch":5,"tp":"alap","t":"card","front":"Iteráció (kör)","back":"A ciklustörzs egyszeri lefutása.","id":"7a572d09"},{"ch":5,"tp":"while","t":"card","front":"Elöltesztelő ciklus","back":"A feltételt a törzs ELŐTT vizsgálja; a törzs akár 0-szor is lefuthat. Pythonban: while és for.","id":"ece7acbf"},{"ch":5,"tp":"hatul","t":"card","front":"Hátultesztelő ciklus","back":"A feltételt a törzs UTÁN vizsgálja; a törzs legalább egyszer lefut. C-ben do … while, Pythonban while True + break.","id":"80a5b2bf"},{"ch":5,"tp":"while","t":"card","front":"A while ciklus három része","back":"1. Kezdőérték (i = 5). 2. Feltétel (i > 0). 3. Léptetés (i = i - 1). Ha a léptetés kimarad: végtelen ciklus.","id":"eb71bd26"},{"ch":5,"tp":"while","t":"card","front":"Nyomkövető táblázat","back":"Táblázat, amelyben körről körre leírjuk a változók értékét. Segít megérteni, mit csinál a program.","id":"678fae7d"},{"ch":5,"tp":"for","t":"card","front":"range(start, stop, lépés)","back":"Számsorozatot ad a starttól a stop ELŐTTIG. range(5): 0–4. range(2, 7): 2–6. range(0, 10, 3): 0, 3, 6, 9. range(5, 0, -1): 5–1.","id":"26bea1d1"},{"ch":5,"tp":"breakcont","t":"card","front":"break és continue","back":"break: azonnal kilép a ciklusból. continue: átugorja a kör hátralévő részét, és jön a következő kör.","id":"5719e27f"},{"ch":5,"tp":"while","t":"card","front":"Őrszem (sentinel) érték","back":"Különleges érték, ami a bevitel végét jelzi (pl. 0 = vége). Az elsőt a ciklus előtt, a többit a törzs végén kérjük be.","id":"876c2107"},{"ch":5,"tp":"minta","t":"card","front":"Összegzés és megszámlálás mintája","back":"Összegzés: osszeg = 0, minden körben osszeg += elem. Megszámlálás: darab = 0, és ha az elem megfelel a feltételnek, darab += 1.","id":"a70f5ae7"},{"ch":5,"tp":"alap","t":"mc","q":"Mire való a ciklus?","o":["Utasítások ismételt végrehajtására","Döntéshozatalra","Adatok bekérésére","Változók létrehozására"],"a":0,"why":"Ismétlés (iteráció) – ez a harmadik építőkő a sorrend és az elágazás mellett.","id":"b68527f0"},{"ch":5,"tp":"while","t":"out","q":"Mit ír ki?","code":"i = 5\nwhile i > 0:\n    print(i)\n    i = i - 1\nprint(\"Indulás!\")","o":["5\n4\n3\n2\n1\nIndulás!","5\n4\n3\n2\n1\n0\nIndulás!","4\n3\n2\n1\n0\nIndulás!","Indulás!"],"a":0,"why":"Amikor i 0 lesz, a feltétel (0 > 0) hamis, kilép – a 0-t már nem írja ki.","id":"a411be08"},{"ch":5,"tp":"while","t":"out","q":"Mit ír ki?","code":"i = 0\nwhile i > 0:\n    print(i)\n    i = i - 1\nprint(\"Kész\")","o":["Kész","0\nKész","Végtelen ciklus","Semmit"],"a":0,"why":"Elöltesztelő: a feltétel már az elején hamis, a törzs egyszer sem fut le.","id":"6f0e6d78"},{"ch":5,"tp":"while","t":"out","q":"Mit ír ki?","code":"i = 1\nwhile i < 20:\n    i = i * 2\nprint(i)","o":["32","16","20","64"],"a":0,"why":"1 → 2 → 4 → 8 → 16 → 32. A 16 < 20 még igaz, ezért még egyszer dupláz; 32 < 20 már hamis.","id":"a2092f72"},{"ch":5,"tp":"while","t":"out","q":"Mit ír ki?","code":"x = 10\ndb = 0\nwhile x > 0:\n    x -= 3\n    db += 1\nprint(db, x)","o":["4 -2","3 1","4 -3","3 -2"],"a":0,"why":"10 → 7 → 4 → 1 → −2: négy kör, x végül −2.","id":"f30b30bd"},{"ch":5,"tp":"while","t":"bug","q":"Ez a ciklus sosem áll le. Melyik sor hiányzik / hibás?","code":"i = 5\nwhile i > 0:\n    print(i)\n    i = i + 1","a":3,"fix":"    i = i - 1","why":"Az i nő, így i > 0 mindig igaz marad → végtelen ciklus. Csökkenteni kell.","id":"c16ad37c"},{"ch":5,"tp":"while","t":"mc","q":"Mi a végtelen ciklus leggyakoribb oka?","o":["Elmarad (vagy rossz) a léptetés, így a feltétel sosem lesz hamis","Túl nagy a kezdőérték","Hiányzik a print","Túl kevés a memória"],"a":0,"why":"A léptetés gondoskodik róla, hogy a feltétel egyszer hamissá váljon.","id":"55a2e946"},{"ch":5,"tp":"while","t":"mc","q":"Hogyan állítasz le egy végtelen ciklusban ragadt programot?","o":["Ctrl + C (vagy Stop gomb)","Ctrl + Z","Megvárod, hogy magától leálljon","Escape"],"a":0,"why":"A legtöbb környezetben a Ctrl + C megszakítja a futást.","id":"449956f5"},{"ch":5,"tp":"while","t":"mc","q":"Melyik a while ciklus három fontos része?","o":["Kezdőérték, feltétel, léptetés","print, input, if","Start, Vége, nyíl","break, continue, else"],"a":0,"why":"Kezdőérték a ciklus előtt, feltétel a while sorban, léptetés a törzsben.","id":"e6f3ef22"},{"ch":5,"tp":"while","t":"order","q":"Rakd sorrendbe a visszaszámlálót (3, 2, 1, Rajt!)!","lines":["i = 3","while i > 0:","    print(i)","    i -= 1","print(\"Rajt!\")"],"why":"Kezdőérték → feltétel → törzs (kiírás, léptetés) → a ciklus utáni, nem behúzott sor.","id":"30bbd7e9"},{"ch":5,"tp":"while","t":"mc","q":"Az őrszemes (0 = vége) összegzésnél hol kérjük be az ELSŐ számot?","o":["A ciklus előtt","A ciklus törzsének elején","A ciklus után","Sehol"],"a":0,"why":"Hogy a feltétel (szam != 0) már az első vizsgálatnál értelmes legyen. A többit a törzs végén kérjük.","id":"64e6bf4e"},{"ch":5,"tp":"while","t":"mc","q":"A felhasználó ezeket írja be: 4, 10, 3, 0. Mit ír ki a program?","code":"osszeg = 0\nszam = int(input(\"Szám (0 = vége): \"))\nwhile szam != 0:\n    osszeg += szam\n    szam = int(input(\"Szám (0 = vége): \"))\nprint(\"Az összeg:\", osszeg)","o":["Az összeg: 17","Az összeg: 0","Az összeg: 4","Az összeg: 14"],"a":0,"why":"4 + 10 + 3 = 17; a 0 az őrszem, az nem számít bele, csak leállítja.","id":"8f6348d8"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"for i in range(5):\n    print(\"Szia!\", i)","o":["Szia! 0\nSzia! 1\nSzia! 2\nSzia! 3\nSzia! 4","Szia! 1\nSzia! 2\nSzia! 3\nSzia! 4\nSzia! 5","Szia! 0\nSzia! 1\nSzia! 2\nSzia! 3\nSzia! 4\nSzia! 5","Szia! 5"],"a":0,"why":"A range(5) a 0, 1, 2, 3, 4 számokat adja – ötöt, 0-tól, az 5 már nincs benne.","id":"b1bf12fb"},{"ch":5,"tp":"for","t":"mc","q":"Milyen számokat ad a range(2, 7)?","o":["2, 3, 4, 5, 6","2, 3, 4, 5, 6, 7","3, 4, 5, 6, 7","2, 7"],"a":0,"why":"A start benne van, a stop már nem.","id":"477a0094"},{"ch":5,"tp":"for","t":"mc","q":"Milyen számokat ad a range(0, 10, 3)?","o":["0, 3, 6, 9","0, 3, 6, 9, 12","3, 6, 9","0, 3, 6"],"a":0,"why":"Harmadik paraméter a lépésköz; a 12 már túl van a 10-en.","id":"9342e61c"},{"ch":5,"tp":"for","t":"mc","q":"Milyen számokat ad a range(5, 0, -1)?","o":["5, 4, 3, 2, 1","5, 4, 3, 2, 1, 0","4, 3, 2, 1, 0","Semmit"],"a":0,"why":"Negatív lépésköz: visszafelé. A 0 (stop) nincs benne.","id":"1ebecbc5"},{"ch":5,"tp":"for","t":"type","q":"Hány számot ad a range(3, 10)?","a":["7"],"why":"10 − 3 = 7 szám: 3, 4, 5, 6, 7, 8, 9.","id":"5feb8668"},{"ch":5,"tp":"for","t":"fill","q":"1-től 10-ig (a 10-et is beleértve) kell kiírni a számokat. Mi a jó range?","code":"for i in ___:\n    print(i)","o":["range(1, 11)","range(1, 10)","range(10)","range(0, 10)"],"a":0,"why":"A stop már nincs benne, ezért eggyel nagyobbat kell írni: 11.","id":"e479c6c3"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"osszeg = 0\nfor i in range(1, 101):\n    osszeg += i\nprint(osszeg)","o":["5050","5000","4950","100"],"a":0,"why":"1 + 2 + … + 100 = 5050 (Gauss: 100 · 101 / 2).","id":"5c85b798"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"for betu in \"alma\":\n    print(betu)","o":["a\nl\nm\na","alma","a l m a","0\n1\n2\n3"],"a":0,"why":"A for egy szöveg betűin is végigmegy, egyesével.","id":"907ce4f1"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"s = 0\nfor i in range(1, 5):\n    s += i\nprint(s)","o":["10","15","4","6"],"a":0,"why":"1 + 2 + 3 + 4 = 10 (az 5 nincs benne).","id":"086295b3"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"for i in range(3):\n    print(\"*\" * (i + 1))","o":["*\n**\n***","***\n***\n***","*\n*\n*","**\n***\n****"],"a":0,"why":"i = 0, 1, 2 → 1, 2, 3 csillag.","id":"90f9d5b9"},{"ch":5,"tp":"for","t":"out","q":"Mit ír ki?","code":"szoveg = \"\"\nfor b in \"abc\":\n    szoveg = b + szoveg\nprint(szoveg)","o":["cba","abc","a","cab"],"a":0,"why":"Mindig az új betűt tesszük ELÉ: a → ba → cba. Ez megfordítja a szót.","id":"3c16f5eb"},{"ch":5,"tp":"for","t":"mc","q":"Mikor válaszd a for ciklust a while helyett?","o":["Ha előre tudod, hányszor (vagy mely elemeken) kell végigmenni","Ha addig kell ismételni, amíg valami előre nem látható nem teljesül","Ha végtelen ciklust akarsz","Soha, a while mindig jobb"],"a":0,"why":"for: ismert darabszám vagy sorozat. while: előre nem látható feltétel.","id":"e8948b27"},{"ch":5,"tp":"for","t":"tf","q":"A for ciklus is elöltesztelő.","a":true,"why":"A kezdőérték, a feltétel és a léptetés „egybe van csomagolva”, de minden kör előtt dönt.","id":"373265ca"},{"ch":5,"tp":"for","t":"bug","q":"Melyik sor hibás?","code":"for i in range(5)\n    print(i)","a":0,"fix":"for i in range(5):","why":"A for sor végéről is hiányzik a kettőspont.","id":"a722c70b"},{"ch":5,"tp":"breakcont","t":"out","q":"Mit ír ki?","code":"for szam in range(1, 11):\n    if szam % 2 == 0:\n        continue\n    if szam > 7:\n        break\n    print(szam)","o":["1\n3\n5\n7","1\n3\n5\n7\n9","2\n4\n6","1\n2\n3\n4\n5\n6\n7"],"a":0,"why":"A párosokat a continue átugorja; 9-nél a break kilép, így a 9-et már nem írja ki.","id":"cbf04791"},{"ch":5,"tp":"breakcont","t":"out","q":"Mit ír ki?","code":"for i in range(10):\n    if i == 3:\n        break\n    print(i)","o":["0\n1\n2","0\n1\n2\n3","3","0\n1\n2\n4\n5\n6\n7\n8\n9"],"a":0,"why":"Amikor i = 3, a break azonnal kilép – a 3-at már nem írja ki.","id":"a7455ca4"},{"ch":5,"tp":"breakcont","t":"out","q":"Mit ír ki?","code":"for i in range(5):\n    if i == 2:\n        continue\n    print(i)","o":["0\n1\n3\n4","0\n1","0\n1\n2\n3\n4","2"],"a":0,"why":"A continue csak a 2-es kört ugorja át, a ciklus folytatódik.","id":"6afb932d"},{"ch":5,"tp":"breakcont","t":"mc","q":"Mi a különbség a break és a continue között?","o":["break kilép a ciklusból, continue csak az adott kör hátralevő részét ugorja át","Ugyanazt csinálják","continue kilép, break átugrik","break leállítja az egész programot"],"a":0,"why":"break = „vége a ciklusnak”, continue = „ezt a kört hagyjuk, jöhet a következő”.","id":"567b8896"},{"ch":5,"tp":"hatul","t":"mc","q":"Melyik ciklusfajtánál fut le a törzs legalább egyszer?","o":["Hátultesztelő","Elöltesztelő","for","Egyiknél sem"],"a":0,"why":"Mert a feltételt csak a törzs UTÁN vizsgálja.","id":"f4fbc1ae"},{"ch":5,"tp":"hatul","t":"mc","q":"Hogyan írunk hátultesztelő ciklust Pythonban?","o":["while True: … és a végén if feltétel: break","do … while","repeat … until","for … else"],"a":0,"why":"A Pythonban nincs do … while, ezért végtelen ciklust írunk, és feltétellel lépünk ki belőle.","id":"69335a04"},{"ch":5,"tp":"hatul","t":"tf","q":"A Pythonban van do … while szerkezet.","a":false,"why":"Nincs; C-ben, C++-ban, Javában, C#-ban, PHP-ban, JavaScriptben van.","id":"d906f0d7"},{"ch":5,"tp":"hatul","t":"mc","q":"Mi a hátultesztelő ciklus tipikus felhasználása?","o":["Bemenet ellenőrzése: kérjük, amíg jó adatot nem kapunk","Számok összegzése 1-től 100-ig","Betűk kiírása","Szorzótábla"],"a":0,"why":"Előbb be kell kérni (törzs), csak utána tudjuk eldönteni, jó-e.","id":"d86bec3c"},{"ch":5,"tp":"hatul","t":"order","q":"Rakd össze a bemenet-ellenőrzőt (1 és 10 közötti szám)!","lines":["while True:","    szam = int(input(\"Szám 1 és 10 között: \"))","    if 1 <= szam <= 10:","        break","    print(\"Hibás szám, próbáld újra!\")","print(\"Köszönöm, a számod:\", szam)"],"why":"Végtelen ciklus, bekérés, kilépési feltétel break-kel, különben hibaüzenet és újra.","id":"ee68edff"},{"ch":5,"tp":"hatul","t":"mc","q":"A Python-megoldásban (while True + break) a break feltétele mit jelent?","o":["A kilépés feltételét (jó az adat)","Az ismétlés feltételét (rossz az adat)","A program végét","Semmit"],"a":0,"why":"Fordított gondolkodás: a C-s do…while a folytatás feltételét írja, a Python break-je a kilépését.","id":"663aabbf"},{"ch":5,"tp":"beagyazott","t":"mc","q":"Egymásba ágyazott ciklusoknál mi történik a külső ciklus egy köre alatt?","o":["A belső ciklus teljesen lefut","A belső ciklus egyet lép","Csak a külső ciklus fut","Mindkettő egyet lép"],"a":0,"why":"Mint az óra: a percmutató 60-at lép, mire az óramutató egyet.","id":"1e25bdc1"},{"ch":5,"tp":"beagyazott","t":"out","q":"Hányszor írja ki, hogy „x”?","code":"for i in range(3):\n    for j in range(4):\n        print(\"x\")","o":["12","7","3","4"],"a":0,"why":"A külső 3-szor fut, mindegyikben a belső 4-szer: 3 · 4 = 12.","id":"42a2406e"},{"ch":5,"tp":"beagyazott","t":"out","q":"Mit ír ki?","code":"for sor in range(1, 3):\n    for oszlop in range(1, 4):\n        print(sor * oszlop, end=\" \")\n    print()","o":["1 2 3 \n2 4 6","1 2 3\n2 4 6\n3 6 9","1 2\n2 4\n3 6","1 2 3 2 4 6"],"a":0,"why":"Két sor (1, 2), soronként három oszlop (1, 2, 3). Az end=\" \" miatt nincs sortörés, az üres print() hozza az új sort.","id":"6b31dcac"},{"ch":5,"tp":"beagyazott","t":"mc","q":"Mit jelent a print(…, end=\"\")?","o":["Ne tegyen sortörést a kiírás végére","Ne írjon ki semmit","Lépjen ki a ciklusból","Írjon üres sort"],"a":0,"why":"Alapból a print sortöréssel zár; az end=\"\" ezt kikapcsolja.","id":"0deb90d6"},{"ch":5,"tp":"minta","t":"out","q":"Mit ír ki?","code":"darab = 0\nfor szam in range(1, 21):\n    if szam % 3 == 0:\n        darab += 1\nprint(darab)","o":["6","7","20","3"],"a":0,"why":"3, 6, 9, 12, 15, 18 → 6 darab. Ez a megszámlálás mintája.","id":"4818405c"},{"ch":5,"tp":"minta","t":"fill","q":"Megszámlálás: hány páros szám van 1 és 10 között? Mi kerül a helyére?","code":"darab = 0\nfor szam in range(1, 11):\n    if szam % 2 == 0:\n        ___\nprint(darab)","o":["darab += 1","darab = 1","darab += szam","break"],"a":0,"why":"Megszámláláskor minden megfelelő elemnél eggyel növeljük a számlálót.","id":"22ff23f5"},{"ch":5,"tp":"minta","t":"fill","q":"Összegzés: add össze a számokat 1-től 5-ig! Mi kerül a helyére?","code":"osszeg = 0\nfor i in range(1, 6):\n    ___\nprint(osszeg)","o":["osszeg += i","osszeg = i","i += osszeg","osszeg += 1"],"a":0,"why":"Összegzéskor minden körben hozzáadjuk az aktuális elemet.","id":"1513ff2f"},{"ch":5,"tp":"minta","t":"bug","q":"Az összegnek 15-nek kellene lennie, de rossz. Melyik sor hibás?","code":"for i in range(1, 6):\n    osszeg = 0\n    osszeg += i\nprint(osszeg)","a":1,"fix":"(az osszeg = 0 sor a ciklus ELÉ kerüljön)","why":"A nullázás a cikluson belül van, így minden körben elölről kezdi – végül csak 5 lesz. A kezdőérték a ciklus elé kell.","id":"979a742a"},{"ch":5,"tp":"minta","t":"order","q":"Rakd össze: számold meg, hány 5-tel osztható szám van 1 és 30 között!","lines":["darab = 0","for szam in range(1, 31):","    if szam % 5 == 0:","        darab += 1","print(darab)"],"why":"Számláló nullázása → ciklus → feltétel → növelés → kiírás a ciklus után.","id":"c6500d72"},{"ch":5,"tp":"jatek","t":"mc","q":"A számkitalálós játékban mi a ciklus feltétele?","code":"titkos = 42\ntipp = 0\nwhile tipp != titkos:\n    tipp = int(input(\"Tipp: \"))","o":["Amíg a tipp nem egyenlő a titkos számmal","Amíg a tipp kisebb 100-nál","10-szer fut le","Amíg a tipp egyenlő a titkos számmal"],"a":0,"why":"Addig kérdez, amíg el nem találod (tipp != titkos).","id":"9ff5be42"},{"ch":5,"tp":"jatek","t":"mc","q":"Miért kell a játék elején a tipp = 0 sor?","o":["Hogy a while feltétele az első vizsgálatkor ne okozzon NameError-t","Mert a titkos szám 0","Hogy a játék 0-tól induljon","Nem kell, el lehet hagyni"],"a":0,"why":"A while az első kör előtt vizsgálja a tipp változót – addigra léteznie kell.","id":"57c3a042"},{"ch":5,"tp":"jatek","t":"fill","q":"A gép sorsolja a titkos számot 1 és 100 között. Mi kerül a helyére?","code":"import random\ntitkos = random.___(1, 100)","o":["randint","random","range","int"],"a":0,"why":"A random.randint(1, 100) egy véletlen egész számot ad 1 és 100 között (mindkettőt beleértve).","id":"3a6c46bd"},{"ch":5,"tp":"while","t":"exp","q":"Mi a különbség az elöltesztelő és a hátultesztelő ciklus között? Mondj egy hétköznapi példát mindkettőre!","model":"Az elöltesztelő a törzs előtt vizsgál, így akár egyszer sem fut le („Amíg éhes vagy, egyél!”). A hátultesztelő a törzs után vizsgál, így legalább egyszer lefut („Egyél, és ha még éhes vagy, egyél még!”).","id":"3ed6d8de"},{"ch":5,"tp":"while","t":"exp","q":"Készíts fejben nyomkövető táblázatot: i = 3; while i > 0: print(i); i -= 1. Mi az i értéke a ciklus után?","model":"Kör 1: i=3 → kiír 3 → i=2. Kör 2: i=2 → kiír 2 → i=1. Kör 3: i=1 → kiír 1 → i=0. Ekkor 0 > 0 hamis, kilép. A ciklus után i = 0.","id":"1c7a5895"},{"ch":5,"tp":"minta","t":"exp","q":"Miért kell az összegző változót (osszeg = 0) a ciklus ELŐTT létrehozni?","model":"Mert ha a cikluson belül lenne, minden körben lenullázódna, és a végén csak az utolsó elem maradna benne. A kezdőértéket egyszer, a ciklus előtt adjuk meg, a ciklus csak hozzáad.","id":"a6a173c9"}],"CH":[{"n":0,"title":"Bevezetés","sub":"Mi az a programozás?","topics":{"alap":"Alapfogalmak"}},{"n":1,"title":"Számrendszerek","sub":"Hogyan számol a gép?","topics":{"helyiertek":"Helyiérték","binaris":"Kettes számrendszer","hexa":"Tizenhatos számrendszer","python":"Átváltás Pythonban","karakter":"Karakterkódok"}},{"n":2,"title":"Operátorok","sub":"Változók, számolás, logika","topics":{"valtozo":"Változók","aritm":"Aritmetika","sorrend":"Műveleti sorrend","ertekadas":"Értékadás","osszehas":"Összehasonlítás","logikai":"Logikai operátorok"}},{"n":3,"title":"Típusok","sub":"Számok, logikai értékek, szövegek","topics":{"tipus":"Adattípusok","szam":"Számok","logikai":"Logikai érték","szoveg":"Szövegek","atalakitas":"Átalakítás"}},{"n":4,"title":"Elágazás","sub":"Döntések a programban","topics":{"if":"if és behúzás","ifelse":"if – else","elif":"if – elif – else","beagyazott":"Egymásba ágyazás","szokoev":"Szökőév","folyamat":"Folyamatábra"}},{"n":5,"title":"Ciklusok","sub":"Ismétlés a programban","topics":{"alap":"Alapok","while":"while ciklus","for":"for és range","breakcont":"break, continue","hatul":"Hátultesztelő","beagyazott":"Egymásba ágyazás","minta":"Összegzés, megszámlálás","jatek":"Számkitalálós"}}],"L":{"0":[{"h":"Mi az a program?","b":"A számítógép egy nagyon szófogadó, de **teljesen szó szerint értelmező** segítő. Nem találja ki, mire gondolsz: csak azt hajtja végre, amit leírtál, abban a sorrendben.\n\n**Program:** utasítások sorozata, amit a gép végre tud hajtani.\n**Algoritmus:** egy feladat megoldásának lépésenkénti leírása (egy recept is az).\n**Programozás:** az algoritmus leírása a gép számára érthető nyelven."},{"h":"Bemenet → feldolgozás → kimenet","b":"Mint egy recept: a **hozzávalók** a bemenet (adatok), a **recept lépései** a program, a **kész étel** a kimenet. Ezt a hármast minden programban megtalálod."},{"h":"A három építőkő","b":"Minden program, akármilyen bonyolult, ebből a háromból áll:\n\n**Sorrend** – az utasítások fentről lefelé, egyenként futnak.\n**Elágazás** – „ha esik, vigyél esernyőt”.\n**Ismétlés** – „amíg forr a víz, főzd a tésztát”."},{"h":"Az első programod","b":"A `print` kiírja a képernyőre, amit a zárójelben kap (ez az **argumentum**). Az idézőjelek közti rész szöveg.","code":"print(\"Helló, világ!\")","out":"Helló, világ!"},{"h":"Bekérés: input","b":"Az `input` megvárja, amíg a felhasználó begépel valamit és Entert nyom. A választ egy „dobozba”, a `nev` változóba tesszük, hogy később is meglegyen.","code":"nev = input(\"Hogy hívnak? \")\nprint(\"Szia, \" + nev + \"!\")","out":"Hogy hívnak? Anna\nSzia, Anna!"},{"h":"Hibák – nem kell félni tőlük","b":"A programhiba neve **bug**, a hibakeresés **debuggolás**. A hibaüzenet nem büntetés, hanem segítség: az **utolsó sora** mondja meg, mi a baj. Minden programozó naponta hibázik."}],"1":[{"h":"Helyiérték","b":"A 4735-ben a 4 nem négyet, hanem **négyezret** ér, mert az ezresek helyén áll: 4·1000 + 7·100 + 3·10 + 5·1.\n\nA tízes számrendszer **alapszáma** 10: tíz számjegy van, és minden hely a jobb szomszédjának tízszerese."},{"h":"Miért kettes számrendszer?","b":"A gép kapcsolókból áll: **ki (0)** vagy **be (1)**. Két állapotot könnyű megbízhatóan megkülönböztetni.\n\n**Bit:** egy 0 vagy 1. **Bájt:** 8 bit.\n\nBináris helyiértékek jobbról balra: **1, 2, 4, 8, 16, 32, 64, 128** – mindig dupla."},{"h":"Binárisból tízesbe","plain":1,"b":"Add össze azokat a helyiértékeket, ahol **1-es** áll.","code":"101101\n32 16 8 4 2 1\n32 + 8 + 4 + 1 = 45","out":"45"},{"h":"Tízesből binárisba","b":"**1. módszer:** oszd 2-vel újra és újra, a maradékokat **alulról felfelé** olvasd.\n\n**2. módszer:** a helyiértékeket balról nézve: belefér? → 1 és vond ki; nem fér → 0.\n\n37 = 32 + 4 + 1 → **100101**. Mindig ellenőrizz visszaváltással!"},{"h":"Hány érték fér el n biten?","b":"n biten **2ⁿ** különböző érték: 4 bit → 16 (0–15), 8 bit → 256 (0–255).\n\nHa egy szám nem fér el, **túlcsordulás** történik."},{"h":"Binárisan összeadni","plain":1,"b":"Ugyanúgy, mint tízesben, csak hamarabb „csordul át”: **1 + 1 = 10** (0 marad, 1 átvitel).","code":"  0110  (6)\n+ 0011  (3)\n------\n  1001  (9)"},{"h":"Tizenhatos (hexa) rendszer","b":"16 számjegy: 0–9, aztán **A=10, B=11, C=12, D=13, E=14, F=15**.\n\nEgy hexa jegy = pontosan **4 bit**, ezért négyesével csoportosítunk: 1010 1111 → **AF**.\n\nD6 = 13·16 + 6 = **214**. Előtagok a kódban: **0x** hexa, **0b** bináris. Színkódokban is ezt látod: #FF8800."},{"h":"Átváltás Pythonban","b":"","code":"print(bin(37))            # 0b100101\nprint(hex(214))           # 0xd6\nprint(int(\"100101\", 2))   # 37\nprint(int(\"D6\", 16))      # 214","out":"0b100101\n0xd6\n37\n214"},{"h":"A betűk is számok","b":"Minden karakternek van egy kódja (ASCII, Unicode). Nagy **A = 65**, kis **a = 97**.","code":"print(ord(\"A\"))\nprint(chr(66))","out":"65\nB"}],"2":[{"h":"A változó egy címkézett doboz","b":"A dobozra ráírjuk a nevét, beletesszük az értéket. Később új érték kerülhet bele, a régi eltűnik.","code":"kor = 15\nnev = \"Anna\"\nprint(nev, kor)\nkor = 16\nprint(kor)","out":"Anna 15\n16"},{"h":"Az = nem egyenlőség!","b":"Az `=` **utasítás**: „a jobb oldalt tedd a bal oldali dobozba”. Olvasd így: *a kor legyen 15*.\n\nAz összehasonlítás jele a `==`."},{"h":"Változónevek szabályai","b":"Betű, számjegy, aláhúzás – de **nem kezdődhet számjeggyel**. A `kor` és a `Kor` két külön változó. Foglalt szó (if, for, while) nem lehet.\n\nVálassz **beszédes** nevet: `osszeg`, `szemelyi_szam`. Ékezetet inkább kerülj.\n\nNem létező változó → **NameError**."},{"h":"Számolás","b":"`+  -  *  /` – az osztás Pythonban **mindig tört**: 6 / 2 = 3.0\n`//` egészosztás · `%` maradék · `**` hatvány","code":"print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\nprint(7 ** 2)","out":"3.5\n3\n1\n49"},{"h":"A maradék (%) ereje","b":"17 cukorka, 5 gyerek: **17 // 5 = 3** jut mindenkinek, **17 % 5 = 2** marad.\n\nPáros? `szam % 2 == 0`\nOsztható 5-tel? `szam % 5 == 0`\nÓra: `15 % 12` = 3"},{"h":"Műveleti sorrend","b":"1. zárójel  2. `**`  3. `* / // %`  4. `+ -` (azonos szinten balról jobbra).\n\nHa bizonytalan vagy: **zárójelezz**.","code":"print(2 + 3 * 4)\nprint((2 + 3) * 4)\nprint(2 + 3 ** 2)","out":"14\n20\n11"},{"h":"x = x + 1 és társai","b":"Előbb a jobb oldal számolódik (5 + 1 = 6), aztán az eredmény kerül x-be.\n\nRövid alakok: `x += 3`, `x -= 3`, `x *= 3`, `x /= 4`, `x //= 3`, `x %= 3`, `x **= 2`.\n\nPythonban **nincs `x++`**, helyette `x += 1`."},{"h":"Csere segédváltozóval","b":"Az `a = b; b = a` nem jó: az a régi értéke elveszik. Kell egy „harmadik pohár”:","code":"seged = a\na = b\nb = seged\n\n# Pythonban röviden:\na, b = b, a"},{"h":"Összehasonlítás","b":"`==` egyenlő · `!=` nem egyenlő · `<  >  <=  >=`\nAz eredmény mindig **True** vagy **False**. Szövegnél a nagybetű számít: \"alma\" == \"Alma\" → False."},{"h":"Logika: and, or, not","b":"**and** – mindkettő igaz kell (soros kapcsolás)\n**or** – elég az egyik (párhuzamos kapcsolás)\n**not** – megfordítja\n\nSorrend: **not → and → or**. Ha keversz, zárójelezz!","code":"kor = 20\nvan_jegye = True\nprint(kor >= 18 and van_jegye)\nprint(kor < 18 or kor >= 65)\nprint(18 <= kor < 65)","out":"True\nFalse\nTrue"}],"3":[{"h":"Miért kellenek típusok?","b":"A memóriában minden bit. Hogy a 01000001 a 65-ös szám vagy az „A” betű, azt a **típus** dönti el. A típus azt is megmondja, mit lehet vele csinálni: két számot szorozhatsz, két nevet nem."},{"h":"A négy alaptípus","b":"**int** – egész: 42, −7\n**float** – tört: 3.14 (tizedes**pont**!)\n**bool** – logikai: True, False\n**str** – szöveg: \"alma\"","code":"print(type(42))\nprint(type(3.14))\nprint(type(True))\nprint(type(\"alma\"))","out":"<class 'int'>\n<class 'float'>\n<class 'bool'>\n<class 'str'>"},{"h":"Egész számok","b":"Javában az int 32 bites (max. 2 147 483 647), ami nem fér el, **túlcsordul**. A Python egészei viszont nőnek, amekkorára kell: `2 ** 100` is működik."},{"h":"Tört számok és a 0.1 rejtélye","b":"Kettes számrendszerben a 0,1 végtelen tört, ezért a gép kerekít. **Törteket ne hasonlíts ==-lel!** Pénznél számolj egészben (fillérben).","code":"print(0.1 + 0.2)\nprint(0.1 + 0.2 == 0.3)\nprint(round(0.1 + 0.2, 2))","out":"0.30000000000000004\nFalse\n0.3"},{"h":"Logikai érték","b":"Csak True vagy False. Az összehasonlítások ilyet adnak, és változóban is tárolhatod: `nagykoru = kor >= 18`.\n\nA **0**, az **üres szöveg** hamisnak számít, minden más igaznak."},{"h":"Szöveg (string)","b":"Idézőjelek közé írjuk. **5 ≠ \"5\"**: 5 + 5 = 10, de \"5\" + \"5\" = \"55\".","code":"print(\"Anna\" + \" \" + \"Kovács\")\nprint(\"-\" * 10)\nprint(len(\"Kovács\"))","out":"Anna Kovács\n----------\n6"},{"h":"Indexelés és szeletelés","b":"A sorszám **0-tól** indul, hátulról −1-től. A szelet `[a:b]` a b **előtti** elemig tart.","code":"szo = \"PROGRAM\"\nprint(szo[0], szo[3], szo[-1])\nprint(szo[1:4])\nprint(szo[:3], szo[4:])","out":"P G M\nROG\nPRO RAM"},{"h":"Szövegműveletek","b":"`.strip()` szélső szóközök le · `.upper()` / `.lower()` · `.replace(mit, mire)` · `.find(mit)` hol van","code":"print(\"alma\".upper())\nprint(\"alma\".find(\"l\"))","out":"ALMA\n1"},{"h":"f-string és escape","b":"Az **f** a szöveg előtt: a `{ }` közé írt érték beíródik. `\\n` új sor, `\\\"` idézőjel.","code":"nev = \"Anna\"\nkor = 15\nprint(f\"{nev} {kor} éves, jövőre {kor + 1}.\")","out":"Anna 15 éves, jövőre 16."},{"h":"Az input mindig szöveg!","b":"Számoláshoz alakítsd át: `int()`, `float()`. Vissza szöveggé: `str()`.\n\n`int(3.99)` → 3 (levág, nem kerekít!). `int(\"alma\")` → hiba.","code":"szuletes = int(input(\"Születési év? \"))\nprint(2026 - szuletes)"},{"h":"Statikus vs. dinamikus","b":"**Dinamikus** (Python, JavaScript, PHP): a változónak nincs előre megadott típusa, `x = 5` után lehet `x = \"öt\"`.\n\n**Statikus** (C, Java, C#): a típust előre meg kell adni (`int x = 5;`), és nem változhat. Szigorúbb, de sok hibát már futtatás előtt kiszűr."}],"4":[{"h":"Döntés a programban","b":"A **szelekció** (elágazás) egy **feltétel** (True/False kifejezés) alapján dönti el, melyik utasítás fusson.\n\nFolyamatábrán: **ovális** start/vége, **téglalap** tevékenység, **rombusz** feltétel, **paralelogramma** be-/kiírás."},{"h":"Egyirányú: if","b":"Ha igaz, csinál valamit; ha hamis, továbbmegy. **Kettőspont** a feltétel után, a **behúzott** sorok tartoznak hozzá.","code":"homerseklet = 3\nif homerseklet < 5:\n    print(\"Vegyél kabátot!\")\nprint(\"Jó utat!\")","out":"Vegyél kabátot!\nJó utat!"},{"h":"A behúzás nem díszítés","b":"Pythonban a **4 szóköz** behúzás határozza meg a **blokkot**. Kimaradt behúzás vagy kettőspont → **IndentationError** / SyntaxError.\n\nÉs ne feledd: összehasonlításhoz `==` kell, nem `=`!"},{"h":"Kétirányú: if – else","b":"Pontosan az egyik ág fut le. Az **else-nek nincs feltétele**.","code":"szam = 7\nif szam % 2 == 0:\n    print(\"páros\")\nelse:\n    print(\"páratlan\")","out":"páratlan"},{"h":"Többágú: if – elif – else","b":"Felülről lefelé vizsgál, az **első igaz** ág fut, a többit meg sem nézi. **A sorrend számít:** a legszigorúbb feltétellel kezdj!","code":"pont = 72\nif pont >= 85:\n    jegy = 5\nelif pont >= 70:\n    jegy = 4\nelif pont >= 55:\n    jegy = 3\nelse:\n    jegy = 1\nprint(jegy)","out":"4"},{"h":"Két if ≠ if + elif","b":"Két külön `if` mindkettő kiértékelődik. Az `elif` csak akkor, ha az előző hamis volt.","code":"x = 15\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")   # ez is lefut!","out":"A\nB"},{"h":"Egymásba ágyazás","b":"Egy ágon belül újabb döntés. A behúzás mutatja, melyik else melyik if-hez tartozik. Gyakran laposítható `and`-del és `elif`-fel.","code":"if esik and van_esernyo:\n    print(\"Esernyővel indulok.\")\nelif esik:\n    print(\"Otthon maradok.\")\nelse:\n    print(\"Sétálok.\")"},{"h":"Szökőév","b":"Szökőév, ha osztható 4-gyel, de 100-zal nem; **vagy** ha osztható 400-zal.\n\n1900 – nem · 2000 – igen · 2024 – igen · 2026 – nem","code":"if (ev % 4 == 0 and ev % 100 != 0) or ev % 400 == 0:\n    print(\"szökőév\")"}],"5":[{"h":"Miért ciklus?","b":"Ezerszer kiírni valamit kézzel lehetetlen. A **ciklus** a **törzsét** ismétli, amíg egy feltétel teljesül. Egy lefutás = egy **iteráció** (kör).\n\n**Elöltesztelő:** előbb vizsgál (akár 0-szor fut).\n**Hátultesztelő:** utána vizsgál (legalább 1-szer fut)."},{"h":"while – amíg","b":"Három rész: **kezdőérték**, **feltétel**, **léptetés**.","code":"i = 5\nwhile i > 0:\n    print(i)\n    i = i - 1\nprint(\"Indulás!\")","out":"5\n4\n3\n2\n1\nIndulás!"},{"h":"Nyomkövető táblázat","b":"Körönként felírod a változók értékét. Az i: 5 → 4 → 3 → 2 → 1 → 0. Amikor 0, a feltétel hamis, kilép.\n\n**Végtelen ciklus:** ha a léptetés kimarad, sosem áll le. Leállítás: **Ctrl + C**."},{"h":"Őrszem érték","b":"Ha előre nem tudjuk, hányszor kell ismételni: a 0 jelzi a végét. Az elsőt a ciklus **előtt**, a többit a törzs **végén** kérjük be.","code":"osszeg = 0\nszam = int(input(\"Szám (0 = vége): \"))\nwhile szam != 0:\n    osszeg += szam\n    szam = int(input(\"Szám (0 = vége): \"))\nprint(osszeg)"},{"h":"for és range","b":"Ha tudod, hányszor kell. A range **stop értéke már nincs benne**.\n\n`range(5)` → 0–4\n`range(2, 7)` → 2–6\n`range(0, 10, 3)` → 0, 3, 6, 9\n`range(5, 0, -1)` → 5–1","code":"for i in range(3):\n    print(\"Szia!\", i)","out":"Szia! 0\nSzia! 1\nSzia! 2"},{"h":"Összegzés és megszámlálás","b":"A két leggyakoribb minta. A gyűjtő változót a ciklus **előtt** nullázd!","code":"osszeg = 0\nfor i in range(1, 101):\n    osszeg += i          # összegzés\n\ndarab = 0\nfor szam in range(1, 21):\n    if szam % 3 == 0:\n        darab += 1       # megszámlálás\nprint(osszeg, darab)","out":"5050 6"},{"h":"Szöveg betűin végig","b":"A for nem csak számokon, hanem egy szöveg betűin is végigmegy.","code":"for betu in \"alma\":\n    print(betu)","out":"a\nl\nm\na"},{"h":"break és continue","b":"**break** – azonnal kilép a ciklusból.\n**continue** – átugorja a kör hátralevő részét.","code":"for szam in range(1, 11):\n    if szam % 2 == 0:\n        continue\n    if szam > 7:\n        break\n    print(szam)","out":"1\n3\n5\n7"},{"h":"Hátultesztelő Pythonban","b":"Pythonban nincs do … while. Helyette: **while True** + **break**. Itt a break feltétele a **kilépés** feltétele.","code":"while True:\n    szam = int(input(\"1 és 10 között: \"))\n    if 1 <= szam <= 10:\n        break\n    print(\"Hibás, újra!\")"},{"h":"Egymásba ágyazott ciklus","b":"A külső minden körében a belső **teljesen** lefut – mint a perc- és óramutató. `end=\"\"`: nincs sortörés a print végén.","code":"for sor in range(1, 4):\n    for oszlop in range(1, 4):\n        print(sor * oszlop, end=\" \")\n    print()","out":"1 2 3\n2 4 6\n3 6 9"},{"h":"Számkitalálós játék","b":"Minden eddigi tudás együtt: ciklus, elágazás, számláló.","code":"import random\ntitkos = random.randint(1, 100)\ntipp = 0\nprobalkozas = 0\nwhile tipp != titkos:\n    tipp = int(input(\"Tipp: \"))\n    probalkozas += 1\n    if tipp < titkos:\n        print(\"Ennél nagyobb.\")\n    elif tipp > titkos:\n        print(\"Ennél kisebb.\")\nprint(f\"Eltaláltad {probalkozas} tippből!\")"}]}};const APP_VERSION="b2c20860";</script>
<script>'use strict';
/* ===== Adatok (a build tölti be: DB.Q, DB.CH, DB.L) ===== */
const QS = DB.Q, CH = DB.CH, LS = DB.L;
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const TYPE = {mc:'Kvíz',out:'Mit ír ki?',tf:'Igaz vagy hamis',fill:'Egészítsd ki',bug:'Hibakeresés',order:'Sorrend',type:'Válaszolj',exp:'Magyarázd el',card:'Fogalom'};
const SELF = new Set(['exp','card']);
const DAY = 864e5, INTERVAL = [0, 1, 2, 4, 8, 16]; // napok dobozonként
const KEY = 'kodmuszak.v1';

/* ===== Tárolás ===== */
let S = load();
function fresh(){ return {v:1, items:{}, days:{}, goal:20, seenLessons:{}, created:Date.now()}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (d && d.items) return Object.assign(fresh(), d); } } catch(e){}
  return fresh();
}
let storageOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e){ storageOk = false; } }

/* ===== Segédek ===== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const dkey = (t=Date.now()) => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const pct = x => Math.round(x*100);
function md(t){ // mini markdown: **b**, `code`, bekezdés, sortörés
  return esc(t).split(/\n\n+/).map(p => '<p>'+p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')+'</p>').join('');
}
const KW = /^(if|elif|else|while|for|in|and|or|not|break|continue|import|True|False|None|def|return)$/;
const BI = /^(print|input|int|float|str|bool|len|range|type|round|bin|hex|ord|chr|random|randint)$/;
function hl(code){
  const re = /(#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(___)|([A-Za-z_áéíóöőúüűÁÉÍÓÖŐÚÜŰ][\wáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += '<span class="c">'+esc(m[1])+'</span>';
    else if (m[2]) out += '<span class="s">'+esc(m[2])+'</span>';
    else if (m[3]) out += '<span class="nmb">'+m[3]+'</span>';
    else if (m[4]) out += '<span class="blank" id="blank">&nbsp;?&nbsp;</span>';
    else if (m[5]) out += KW.test(m[5]) ? '<span class="k">'+m[5]+'</span>' : BI.test(m[5]) ? '<span class="f">'+m[5]+'</span>' : esc(m[5]);
  }
  return out + esc(code.slice(last));
}
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1900); }

/* ===== Ismétlési rendszer (Leitner-dobozok) ===== */
function st(id){ return S.items[id]; }
function record(id, res){ // res: 1 = jó, 0.5 = részben, 0 = rossz
  const now = Date.now(); let x = S.items[id] || {b:0, s:0, c:0, w:0};
  x.s++;
  if (res === 1){ x.c++; x.b = Math.min(5, x.b+1); x.due = now + INTERVAL[x.b]*DAY - 3600e3; }
  else if (res === 0.5){ x.c += .5; x.b = Math.max(1, x.b); x.due = now + DAY - 3600e3; }
  else { x.w++; x.b = 1; x.due = now + 10*60e3; }
  x.lr = res; x.l = now; S.items[id] = x;
  const d = S.days[dkey()] || (S.days[dkey()] = {n:0, ok:0});
  d.n++; d.ok += res; save();
}
const mastery = id => { const x = st(id); return x ? x.b/5 : 0; };
const avgM = ids => ids.length ? ids.reduce((a,id)=>a+mastery(id),0)/ids.length : 0;
const idsOf = (ch, tp) => QS.filter(q => (ch==null || q.ch===ch) && (tp==null || q.tp===tp)).map(q=>q.id);
const dueIds = () => { const now = Date.now(); return QS.filter(q => { const x = st(q.id); return x && x.due <= now; }).sort((a,b)=>st(a.id).due-st(b.id).due).map(q=>q.id); };
const newIds = (ch) => QS.filter(q => !st(q.id) && (ch==null || q.ch===ch)).map(q=>q.id);
const missIds = () => QS.filter(q => { const x = st(q.id); return x && x.w > 0 && x.lr === 0; }).map(q=>q.id);
function streak(){
  let n = 0, t = Date.now();
  if (!((S.days[dkey(t)]||{}).n >= 5)) t -= DAY; // a mai nap még nem számít „elrontottnak”
  while ((S.days[dkey(t)]||{}).n >= 5){ n++; t -= DAY; }
  return n;
}
function pickNew(count, ch){ // fejezet-sorrendben, a legalacsonyabb nyitott fejezetből, kicsit keverve
  const pool = newIds(ch); if (!pool.length) return [];
  const firstCh = QBY[pool[0]].ch;
  const sameCh = pool.filter(id => QBY[id].ch === firstCh);
  const cards = sameCh.filter(id => QBY[id].t === 'card'), rest = sameCh.filter(id => QBY[id].t !== 'card');
  // először néhány fogalomkártya, aztán feladatok
  const pick = [...shuffle(cards).slice(0, Math.ceil(count/3)), ...shuffle(rest.slice(0, 18))].slice(0, count);
  if (pick.length < count) pick.push(...pickNew(count - pick.length, ch).filter(id=>!pick.includes(id)));
  return pick;
}
function interleave(a){ // ne jöjjön sok azonos típus egymás után
  const out = [], rest = a.slice();
  while (rest.length){ let i = rest.findIndex(id => !out.length || QBY[id].t !== QBY[out[out.length-1]].t); if (i < 0) i = 0; out.push(rest.splice(i,1)[0]); }
  return out;
}

/* ===== Módok ===== */
function startDaily(){
  const due = dueIds(); const N = 15;
  const takeDue = due.slice(0, due.length >= N ? N-3 : due.length);
  const ids = [...takeDue, ...pickNew(N - takeDue.length)];
  if (!ids.length) return toast('Mindent átvettél – nézz vissza holnap!');
  startSession({title:'Napi edzés', ids:interleave(shuffle(ids))});
}
function startQuick(){
  const due = dueIds(); let ids = due.slice(0, 8);
  if (ids.length < 8){ const seen = shuffle(QS.filter(q=>st(q.id) && !ids.includes(q.id) && !SELF.has(q.t)).sort((a,b)=>mastery(a.id)-mastery(b.id)).slice(0,20).map(q=>q.id)); ids.push(...seen.slice(0, 8-ids.length)); }
  if (ids.length < 8) ids.push(...pickNew(8-ids.length));
  startSession({title:'5 perces kör', ids:interleave(shuffle(ids))});
}
function startMisses(){
  const ids = missIds(); if (!ids.length) return toast('Nincs hibás válaszod. Szép!');
  startSession({title:'Hibáim', ids:shuffle(ids).slice(0, 15)});
}
function startExam(){
  const pool = QS.filter(q => !SELF.has(q.t));
  const per = Math.ceil(20 / CH.length); let ids = [];
  CH.forEach(c => ids.push(...shuffle(pool.filter(q=>q.ch===c.n)).slice(0, per).map(q=>q.id)));
  ids = shuffle(ids).slice(0, 20);
  startSession({title:'Próbadolgozat', ids, exam:true});
}
function startChapter(ch){
  const all = idsOf(ch); const due = dueIds().filter(id=>QBY[id].ch===ch);
  const nw = newIds(ch); const weak = all.filter(id=>st(id) && mastery(id) < .6 && !due.includes(id));
  const ids = [...due.slice(0,6), ...shuffle(weak).slice(0,3), ...nw.slice(0, 12)].slice(0, 12);
  const fill = shuffle(all.filter(id=>!ids.includes(id))).slice(0, 12-ids.length);
  startSession({title:CH[ch].title, ids:interleave(shuffle([...ids, ...fill]))});
}
function startTopic(ch, tp){
  const ids = idsOf(ch, tp).sort((a,b)=>mastery(a)-mastery(b)).slice(0, 12);
  startSession({title:CH[ch].topics[tp], ids:interleave(shuffle(ids))});
}
function startCards(ch){
  const ids = QS.filter(q=>q.t==='card' && (ch==null || q.ch===ch)).map(q=>q.id);
  startSession({title:'Fogalomkártyák', ids:shuffle(ids).sort((a,b)=>mastery(a)-mastery(b)).slice(0, 15)});
}

/* ===== Gyakorló menet ===== */
let SES = null;
function startSession(o){
  SES = {title:o.title, queue:o.ids.slice(), total:o.ids.length, done:0, exam:!!o.exam, res:[], again:new Set()};
  nextQ();
}
function nextQ(){
  document.querySelectorAll('.sheet').forEach(e=>e.remove());
  if (!SES.queue.length) return summary();
  SES.cur = QBY[SES.queue.shift()]; SES.answered = false; renderQ();
}
function head(q){
  const ch = CH[q.ch];
  return `<div class="topbar"><button class="x" data-quit aria-label="Kilépés">✕</button><div class="prog"><i style="width:${SES.done/(SES.total)*100}%"></i></div><div class="cnt">${Math.min(SES.done+1, SES.total)}/${SES.total}</div></div>
  <div class="qtag"><span class="pill y">${TYPE[q.t]}</span><span class="pill">${q.ch}. ${esc(ch.title)} · ${esc(ch.topics[q.tp]||'')}</span>${SES.again.has(q.id)?'<span class="pill">visszakérdezés</span>':''}</div>`;
}
function renderQ(){
  const q = SES.cur; let body = '', dock = '';
  const code = q.code && q.t !== 'bug' ? `<pre class="code">${hl(q.code)}</pre>` : '';
  const KEYS = 'ABCD';
  if (q.t === 'mc' || q.t === 'out' || q.t === 'fill'){
    SES.order = shuffle(q.o.map((_,i)=>i));
    const multi = q.o.some(o=>o.includes('\n')) || q.t !== 'mc';
    body = `<div class="qtext">${esc(q.q)}</div>${code}<div class="opts">${SES.order.map((oi,k)=>`<button class="opt" data-opt="${oi}"><span class="key">${KEYS[k]}</span>${multi?`<pre>${esc(q.o[oi])}</pre>`:`<span>${esc(q.o[oi])}</span>`}</button>`).join('')}</div>`;
  } else if (q.t === 'tf'){
    body = `<div class="qtext">${esc(q.q)}</div>${code}<div class="tf"><button class="opt" data-tf="1">Igaz</button><button class="opt" data-tf="0">Hamis</button></div>`;
  } else if (q.t === 'type'){
    const numeric = q.a.every(a=>/^\d+$/.test(a));
    body = `<div class="qtext">${esc(q.q)}</div>${code}<input class="inp" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${numeric?'inputmode="numeric" pattern="[0-9]*"':''} placeholder="Írd be a választ">`;
    dock = `<button class="primary" data-check-type>Ellenőrzés</button>`;
  } else if (q.t === 'bug'){
    body = `<div class="qtext">${esc(q.q)}</div><p class="muted small" style="margin-top:-6px">Koppints a hibás sorra.</p><div class="bugcode">${q.code.split('\n').map((l,i)=>`<button class="bugline" data-bug="${i}"><span class="ln">${i+1}</span><pre>${hl(l)||' '}</pre></button>`).join('')}</div>`;
  } else if (q.t === 'order'){
    SES.pick = []; SES.tiles = shuffle(q.lines.map((_,i)=>i));
    if (SES.tiles.every((v,i)=>v===i) && q.lines.length > 1) SES.tiles.reverse();
    body = `<div class="qtext">${esc(q.q)}</div><p class="muted small" style="margin-top:-6px">Koppints a sorokra a helyes sorrendben. A behúzás is számít!</p><div class="answerbox" id="abox"></div><div class="tiles" id="tiles"></div>`;
    dock = `<button class="primary" data-check-order disabled>Ellenőrzés</button>`;
  } else if (q.t === 'exp'){
    body = `<div class="qtext">${esc(q.q)}</div>${code}<textarea class="inp" id="expin" placeholder="Írd le a saját szavaiddal (nem kötelező, de így ragad meg igazán)"></textarea><div id="modelbox"></div>`;
    dock = `<button class="primary" data-show-model>Mutasd a mintaválaszt</button>`;
  } else if (q.t === 'card'){
    body = `<p class="muted" style="margin:0 0 10px">Mondd el fejben, mit jelent, aztán fordítsd meg.</p><button class="flip" id="flip" data-flip><div class="front">${esc(q.front)}</div><div class="hint">Koppints a megfordításhoz</div></button>`;
  }
  overlay(head(q) + body, 'session', dock);
  if (q.t === 'order') drawOrder();
}
function drawOrder(){
  const q = SES.cur;
  $('#abox').innerHTML = SES.pick.length ? SES.pick.map((li,k)=>`<button class="tile" data-unpick="${k}"><pre>${hl(q.lines[li])}</pre></button>`).join('') : '<div class="ph">Ide kerülnek a kiválasztott sorok…</div>';
  $('#tiles').innerHTML = SES.tiles.map(li=>`<button class="tile ${SES.pick.includes(li)?'used':''}" data-pick="${li}"><pre>${hl(q.lines[li])}</pre></button>`).join('');
  const b = $('[data-check-order]'); if (b) b.disabled = SES.pick.length !== q.lines.length;
}
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/^["']|["']$/g,''); }

function answer(res, extra={}){
  if (SES.answered) return; SES.answered = true;
  const q = SES.cur; record(q.id, res); SES.done++;
  SES.res.push({id:q.id, res});
  let againNote = '';
  if (res < 1 && !SES.exam && !SES.again.has(q.id)){
    SES.again.add(q.id); SES.total++;
    SES.queue.splice(Math.min(3, SES.queue.length), 0, q.id);
    againNote = '<div class="again">Pár kérdés múlva még egyszer visszakérdezem.</div>';
  }
  const cls = res === 1 ? 'good' : res === 0.5 ? 'half' : 'bad';
  const praise = ['Pontosan!','Így van!','Szép munka!','Helyes!','Ügyes!'];
  const title = res === 1 ? praise[Math.floor(Math.random()*praise.length)] : res === 0.5 ? 'Majdnem – ismételjük még' : 'Nem egészen';
  let right = '';
  if (res < 1){
    if (q.t==='mc'||q.t==='out'||q.t==='fill') right = `<div class="lbl">A helyes válasz</div><div class="fixline">${esc(q.o[q.a])}</div>`;
    if (q.t==='type') right = `<div class="lbl">A helyes válasz</div><div class="fixline">${esc(q.a[0])}</div>`;
    if (q.t==='order') right = `<div class="lbl">A helyes sorrend</div><div class="fixline">${esc(q.lines.join('\n'))}</div>`;
  }
  if (q.t==='bug' && q.fix) right = `<div class="lbl">Javítva</div><div class="fixline">${esc(q.fix)}</div>`;
  const sh = document.createElement('div'); sh.className = 'sheet '+cls;
  sh.innerHTML = `<div class="in"><h3>${title}</h3>${right}${q.why?`<div class="why">${md(q.why)}</div>`:''}${againNote}<button class="primary" data-next>${SES.queue.length?'Tovább':'Eredmény'}</button></div>`;
  document.querySelectorAll('.dock').forEach(e=>e.remove());
  document.body.appendChild(sh);
}
function selfRate(){ return `<div class="rate"><button class="r0" data-rate="0">Nem tudtam</button><button class="r1" data-rate="0.5">Részben</button><button class="r2" data-rate="1">Tudtam</button></div>`; }

function summary(){
  const r = SES.res; const first = {}; r.forEach(x => { if (!(x.id in first)) first[x.id] = x.res; });
  const ids = Object.keys(first); const sc = ids.reduce((a,id)=>a+first[id],0); const p = ids.length ? sc/ids.length : 0;
  const missed = ids.filter(id=>first[id] < 1);
  let grade = '';
  if (SES.exam){ const P = p*100; const j = P>=85?5:P>=70?4:P>=55?3:P>=40?2:1; grade = `<div class="grade">Jegy: ${j} – ${['','elégtelen','elégséges','közepes','jó','jeles'][j]}</div>`; }
  const msg = p >= .9 ? 'Kiváló! Ez már nagyon megy.' : p >= .7 ? 'Jó munka, csak így tovább.' : p >= .5 ? 'Halad! A hibákat holnap újra eléd hozom.' : 'Semmi gond – az ismétlés pont erre való.';
  overlay(`<div class="topbar"><button class="x" data-close aria-label="Bezárás">✕</button><div class="prog"><i style="width:100%"></i></div><div class="cnt">kész</div></div>
   <div class="score"><div class="muted">${esc(SES.title)}</div><div class="big">${pct(p)}%</div><div style="margin-top:6px">${Math.round(sc*10)/10} / ${ids.length} első próbálkozásra</div>${grade}<p class="muted" style="margin-top:14px">${msg}</p></div>
   ${missed.length?`<h3 style="margin:10px 0">Ezeket érdemes átnézni</h3><div class="misslist">${missed.map(id=>{const q=QBY[id];const ans = q.o ? q.o[q.a] : q.t==='type' ? q.a[0] : q.t==='tf' ? (q.a?'Igaz':'Hamis') : q.t==='bug' ? q.fix : q.t==='card' ? q.back : q.t==='exp' ? q.model : q.t==='order' ? q.lines.join('\n') : '';
     return `<div class="miss"><b>${esc(TYPE[q.t])}:</b> ${esc(q.q||q.front)}${ans?`<div class="fixline" style="margin:6px 0 0">${esc(ans)}</div>`:''}${q.why?`<div class="muted small" style="margin-top:4px">${esc(q.why)}</div>`:''}</div>`}).join('')}</div>`:''}`, 'summary',
   `<div class="btnrow">${missed.length?`<button class="primary ghost" data-redo='${JSON.stringify(missed)}'>Hibák újra</button>`:''}<button class="primary" data-close>Kész</button></div>`);
}

/* ===== Haladás ===== */
function renderStats(){
  const items = Object.values(S.items); const seen = items.length;
  const tot = items.reduce((a,x)=>a+x.s,0), ok = items.reduce((a,x)=>a+x.c,0);
  const mastered = items.filter(x=>x.b>=3).length;
  const m = avgM(QS.map(q=>q.id));
  // 14 nap
  const days = []; for (let i=13;i>=0;i--){ const t = Date.now()-i*DAY; days.push({k:dkey(t), d:new Date(t), ...(S.days[dkey(t)]||{n:0,ok:0})}); }
  const mx = Math.max(S.goal, ...days.map(d=>d.n));
  const wd = ['V','H','K','Sz','Cs','P','Sz'];
  // típusonként
  const byT = {}; QS.forEach(q=>{ const x = st(q.id); if (!x) return; const b = byT[q.t] || (byT[q.t] = {s:0,c:0}); b.s += x.s; b.c += x.c; });
  // gyenge témák
  const weak = []; CH.forEach(c=>Object.keys(c.topics).forEach(tp=>{ const ids = idsOf(c.n,tp); const sn = ids.filter(id=>st(id)); if (sn.length >= 2){ const acc = sn.reduce((a,id)=>a+st(id).c/st(id).s,0)/sn.length; weak.push({ch:c.n,tp,acc,name:c.topics[tp]}); } }));
  weak.sort((a,b)=>a.acc-b.acc);
  const heatColor = v => v===null ? 'background:#0F1729;color:var(--dim)' : `background:hsla(${Math.round(v*150)},70%,55%,.22);color:hsl(${Math.round(v*150)},80%,72%)`;
  $('#app').innerHTML = `<div class="screen"><h1>Haladás</h1>
   <div class="kpis">
     <div class="kpi"><div class="v">${pct(m)}%</div><div class="l">elsajátítva (${QS.length} kérdésből)</div></div>
     <div class="kpi"><div class="v">${streak()}</div><div class="l">nap sorozat</div></div>
     <div class="kpi"><div class="v">${tot}</div><div class="l">válasz eddig · ${seen} különböző kérdés</div></div>
     <div class="kpi"><div class="v">${tot?pct(ok/tot):0}%</div><div class="l">helyes arány · ${mastered} kérdés már biztos</div></div>
   </div>
   <div class="card"><h3>Az elmúlt 14 nap</h3>
     <div class="days">${days.map((d,i)=>`<div class="d ${i===13?'today':''}"><div class="col" style="height:${Math.max(3,d.n/mx*100)}%"><i style="height:${d.n?d.ok/d.n*100:0}%"></i></div><span>${wd[d.d.getDay()]}</span></div>`).join('')}</div>
     <div class="legend"><span><i style="background:var(--signal)"></i>helyes</span><span><i style="background:var(--panel2)"></i>összes válasz</span></div></div>
   <div class="card"><h3>Témák térképe</h3><p class="muted small" style="margin:4px 0 0">Piros: gyenge, zöld: megy. A szürkét még nem gyakoroltad.</p>
     <div class="heat">${CH.map(c=>`<div class="hrow"><div class="hn">${c.n}. ${esc(c.title)}</div><div class="cells">${Object.entries(c.topics).map(([tp,nm])=>{ const ids = idsOf(c.n,tp); const any = ids.some(id=>st(id)); return `<button class="cell" data-topic="${c.n}|${tp}" style="${heatColor(any?avgM(ids):null)}">${esc(nm)}</button>`; }).join('')}</div></div>`).join('')}</div></div>
   ${weak.length?`<div class="card"><h3>Ami még nem megy</h3><div class="weak">${weak.slice(0,4).map(w=>`<button data-topic="${w.ch}|${w.tp}"><span>${esc(w.name)} <span class="muted small">· ${w.ch}. fejezet</span></span><span class="w2">${pct(w.acc)}%</span></button>`).join('')}</div></div>`:''}
   <div class="card"><h3>Feladattípusonként</h3>${Object.keys(TYPE).map(t=>{ const b = byT[t]; const a = b&&b.s ? b.c/b.s : null; return `<div class="typerow"><span>${TYPE[t]}</span><div class="bar ${a>=.8?'ok':''}"><i style="width:${a===null?0:pct(a)}%"></i></div><b>${a===null?'–':pct(a)+'%'}</b></div>`; }).join('')}</div>
   <div class="card"><h3>Beállítások és mentés</h3>
     <div class="setrow"><span>Napi cél</span><div class="seg">${[10,20,30,50].map(g=>`<button class="${S.goal===g?'on':''}" data-goal="${g}">${g}</button>`).join('')}</div></div>
     <div class="setrow"><span>Haladás mentése fájlba</span><button class="btn2" data-export>Mentés</button></div>
     <div class="setrow"><span>Mentés visszatöltése</span><button class="btn2" data-import>Visszatöltés</button></div>
     <div class="setrow"><span>Telepítés a főképernyőre</span><button class="btn2" data-help>Útmutató</button></div>
     <div class="setrow"><span>Haladás törlése</span><button class="btn2 danger" data-reset>Törlés</button></div>
   </div>
   <p class="muted small" style="text-align:center">Kódműszak · Programozás alapjai 0–5. fejezet · ${QS.length} kérdés</p>
  </div>`;
}
function modal(html){ const m = document.createElement('div'); m.className='modal'; m.innerHTML = `<div class="box">${html}</div>`; m.addEventListener('click', e=>{ if (e.target===m) m.remove(); }); document.body.appendChild(m); return m; }
function exportData(){
  const data = JSON.stringify(S); const name = `kodmuszak-mentes-${dkey()}.json`;
  const m = modal(`<h2>Haladás mentése</h2><p class="muted">Mentsd el a fájlt a Fájlok appba vagy az iCloudba. Ha nem jelenik meg a mentés, használd a Másolás gombot, és illeszd be egy jegyzetbe.</p>
   <div class="btnrow" style="margin-top:12px"><button class="primary" data-dl>Fájl mentése</button><button class="primary ghost" data-copy>Másolás</button></div>
   <button class="primary ghost" data-closem style="margin-top:10px">Bezárás</button>`);
  m.querySelector('[data-dl]').onclick = async () => {
    try {
      const file = new File([data], name, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Kódműszak mentés'}); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Mentés elkészült'); } catch(e){ toast('Itt nem megy a letöltés – használd a Másolást'); }
  };
  m.querySelector('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(data); toast('Vágólapra másolva'); } catch(e){ toast('A másolás nem sikerült'); } };
  m.querySelector('[data-closem]').onclick = () => m.remove();
}
function importData(){
  const m = modal(`<h2>Mentés visszatöltése</h2><p class="muted">Válaszd ki a mentésfájlt, vagy illeszd be a szövegét. A jelenlegi haladás helyére kerül.</p>
   <input type="file" id="ifile" accept=".json,application/json,text/plain" style="margin:10px 0"><textarea class="inp" id="itext" placeholder="…vagy illeszd be ide a mentés szövegét"></textarea>
   <div class="btnrow" style="margin-top:12px"><button class="primary ghost" data-closem>Mégse</button><button class="primary" data-doimp>Visszatöltés</button></div>`);
  const apply = txt => { try { const d = JSON.parse(txt); if (!d || !d.items) throw 0; S = Object.assign(fresh(), d); save(); m.remove(); toast('Visszatöltve'); render(); } catch(e){ toast('Ez nem érvényes mentés'); } };
  m.querySelector('#ifile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(f); };
  m.querySelector('[data-doimp]').onclick = () => apply(m.querySelector('#itext').value);
  m.querySelector('[data-closem]').onclick = () => m.remove();
}
function helpInstall(){
  const m = modal(`<h2>Telepítés iPhone-ra</h2><ol class="steps"><li>Nyisd meg az app címét a <b>Safariban</b>.</li><li>Koppints a <b>Megosztás</b> gombra (négyzet felfelé mutató nyíllal).</li><li>Válaszd a <b>Főképernyőhöz adás</b> lehetőséget, majd: <b>Hozzáadás</b>.</li><li>Ezután a Kódműszak ikonról indítsd: teljes képernyőn fut, és internet nélkül is működik.</li></ol>
  <p class="muted small" style="margin-top:12px">A haladásod a telefonon tárolódik. Ha törlöd az appot, az is törlődik – ezért időnként készíts mentést.</p><button class="primary" data-closem>Értem</button>`);
  m.querySelector('[data-closem]').onclick = () => m.remove();
}
function resetAll(){
  const m = modal(`<h2>Biztosan törlöd?</h2><p class="muted">Minden válaszod és a sorozatod is elvész. Előtte érdemes mentést készíteni.</p><div class="btnrow" style="margin-top:12px"><button class="primary ghost" data-closem>Mégse</button><button class="primary" style="background:var(--bad);color:#3A0909" data-doreset>Törlés</button></div>`);
  m.querySelector('[data-closem]').onclick = () => m.remove();
  m.querySelector('[data-doreset]').onclick = () => { S = fresh(); save(); m.remove(); toast('Haladás törölve'); render(); };
}

/* ===== Eseménykezelés ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab){ closeOverlay(true); return go(d.tab); }
  if (d.act){ return ({daily:startDaily, quick:startQuick, miss:startMisses, exam:startExam, cards:()=>startCards(null)})[d.act](); }
  if (d.ch !== undefined) return openChapter(+d.ch);
  if (d.close !== undefined) return closeOverlay();
  if (d.lesson !== undefined) return openLesson(+d.lesson, 0);
  if (d.lnav){ const [n,i] = d.lnav.split('|').map(Number); return openLesson(n,i); }
  if (d.chpractice !== undefined) return startChapter(+d.chpractice);
  if (d.chcards !== undefined) return startCards(+d.chcards);
  if (d.topic){ const [n,tp] = d.topic.split('|'); return startTopic(+n, tp); }
  if (d.quit !== undefined){ if (SES && SES.res.length) return summary(); return closeOverlay(); }
  if (d.next !== undefined) return nextQ();
  if (d.redo){ return startSession({title:'Hibák újra', ids:JSON.parse(d.redo)}); }
  if (d.goal){ S.goal = +d.goal; save(); return render(); }
  if (d.export !== undefined) return exportData();
  if (d.import !== undefined) return importData();
  if (d.help !== undefined) return helpInstall();
  if (d.reset !== undefined) return resetAll();
  if (!SES || SES.answered) return;
  const q = SES.cur;
  if (d.opt !== undefined){
    const ok = +d.opt === q.a;
    document.querySelectorAll('.opt').forEach(b=>{ const oi = +b.dataset.opt; if (oi===q.a) b.classList.add('right'); else if (b===t) b.classList.add('wrong'); else b.classList.add('fade'); });
    if (q.t==='fill' && $('#blank')) $('#blank').textContent = q.o[q.a];
    return answer(ok?1:0);
  }
  if (d.tf !== undefined){
    const ok = (d.tf === '1') === q.a;
    document.querySelectorAll('[data-tf]').forEach(b=>{ if ((b.dataset.tf==='1')===q.a) b.classList.add('right'); else if (b===t) b.classList.add('wrong'); });
    return answer(ok?1:0);
  }
  if (d.bug !== undefined){
    const ok = +d.bug === q.a;
    document.querySelectorAll('.bugline').forEach(b=>{ if (+b.dataset.bug===q.a) b.classList.add('right'); else if (b===t) b.classList.add('wrong'); });
    return answer(ok?1:0);
  }
  if (d.pick !== undefined){ const li = +d.pick; if (!SES.pick.includes(li)) SES.pick.push(li); return drawOrder(); }
  if (d.unpick !== undefined){ SES.pick.splice(+d.unpick, 1); return drawOrder(); }
  if (d.checkOrder !== undefined){
    const ok = SES.pick.every((li,k)=>q.lines[li]===q.lines[k]);
    document.querySelectorAll('#abox .tile').forEach((b,k)=>b.classList.add(q.lines[SES.pick[k]]===q.lines[k]?'right':'wrong'));
    return answer(ok?1:0);
  }
  if (d.checkType !== undefined){
    const inp = $('#tin'); const v = norm(inp.value); if (!v) { inp.focus(); return; }
    const ok = q.a.some(a=>norm(a)===v); inp.classList.add(ok?'right':'wrong'); inp.blur();
    return answer(ok?1:0);
  }
  if (d.showModel !== undefined){
    $('#modelbox').innerHTML = `<div class="model"><div class="lbl">Mintaválasz</div>${md(q.model)}</div><p class="muted small" style="margin:12px 0 0">Vesd össze a sajátoddal: mennyire tudtad?</p>${selfRate()}`;
    document.querySelectorAll('.dock').forEach(e=>e.remove());
    $('#modelbox').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if (d.flip !== undefined){
    if (t.dataset.flipped) return; t.dataset.flipped = 1;
    t.innerHTML = `<div class="front">${esc(q.front)}</div><div class="back">${esc(q.back)}</div>`;
    t.insertAdjacentHTML('afterend', `<p class="muted small" style="margin:14px 0 0;text-align:center">Mennyire tudtad?</p>${selfRate()}`);
    return;
  }
  if (d.rate !== undefined) return answer(+d.rate);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'tin'){ e.preventDefault(); const b = $('[data-check-type]'); if (b) b.click(); } });

/* ===== Indítás ===== */
renderTabs(); render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){ try { navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){} }
</script>
</body></html>
