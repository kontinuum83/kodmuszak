<link rel="manifest" href="manifest.webmanifest">
<style>:root{
  --bg:#131C2E; --panel:#1B2740; --panel2:#233150; --line:#2E3D5D;
  --text:#EAF0FA; --muted:#9AA8C2; --dim:#6F7D99;
  --signal:#FFC94D; --signal-ink:#2A2000;
  --ok:#46D3A0; --bad:#FF7B7B; --half:#8FB4FF;
  --code:#0E1525;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top,0px); --sb: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--round);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:750}
h3{font-size:18px;font-weight:700}
p{margin:0 0 .6em}
.muted{color:var(--muted)}
.small{font-size:14px}
code,.mono{font-family:var(--mono);font-size:.92em}
p code,li code,.lb code,.why code{background:var(--code);padding:1px 6px;border-radius:6px;color:#FFE3A3}

#app{max-width:620px;margin:0 auto;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 96px)}
.screen{display:flex;flex-direction:column;gap:18px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(19,28,46,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(var(--sb) + 8px);display:flex;justify-content:center}
#tabs .in{display:flex;gap:6px;max-width:620px;width:100%}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--dim);font-size:12px;font-weight:600}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--signal)}

/* home head */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hello .date{color:var(--muted);font-size:15px;margin-bottom:4px}
.streak{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
.streak b{color:var(--signal)}

/* the shift card: the one bold element */
.shift{background:var(--panel);border-radius:var(--r-lg);padding:20px 18px 18px;border:1px solid var(--line)}
.shift .row{display:flex;justify-content:space-between;align-items:baseline}
.shift .big{font-family:var(--round);font-size:44px;font-weight:800;line-height:1}
.shift .big small{font-size:20px;color:var(--muted);font-weight:700}
.tape{position:relative;height:22px;border-radius:6px;background:#0F1729;overflow:hidden;margin:14px 0 10px;border:1px solid var(--line)}
.tape i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,var(--signal) 0 14px,#E9B53C 14px 28px);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tape.done i{background:repeating-linear-gradient(-45deg,var(--ok) 0 14px,#3BBE8F 14px 28px)}
.shift .meta{display:flex;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.shift .meta b{color:var(--text)}

.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--signal);color:var(--signal-ink);font-family:var(--round);font-weight:800;font-size:19px;padding:17px;border-radius:16px;margin-top:16px}
.primary:active{transform:scale(.985)}
.primary.ghost{background:var(--panel2);color:var(--text)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.mode:active{background:var(--panel2)}
.mode .t{font-weight:700;font-family:var(--round);font-size:17px}
.mode .d{color:var(--muted);font-size:13.5px;line-height:1.3}
.mode .n{margin-top:auto;font-family:var(--round);font-weight:800;color:var(--signal);font-size:15px}
.mode[disabled]{opacity:.45}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sect a,.link{color:var(--signal);font-weight:600;font-size:15px;text-decoration:none}

/* chapter list */
.chlist{display:flex;flex-direction:column;gap:10px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:left;width:100%}
.ch:active{background:var(--panel2)}
.ch .num{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:20px;color:var(--signal)}
.ch .nm{font-weight:700}
.ch .sb{color:var(--muted);font-size:14px}
.ch .pct{font-family:var(--round);font-weight:800;font-size:15px;color:var(--muted)}
.bar{height:6px;background:#0F1729;border-radius:4px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--signal);border-radius:4px}
.bar.ok i{background:var(--ok)}

/* chapter page */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--signal);font-weight:600;font-size:16px;margin-bottom:-4px}
.chhead .kicker{color:var(--signal);font-family:var(--round);font-weight:800;font-size:15px;margin-bottom:4px}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1;margin-top:0}
.topics{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.topic{display:grid;grid-template-columns:1fr 92px 28px;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.topic:first-child{border-top:0}
.topic:active{background:var(--panel2)}
.topic .tn{font-weight:600}
.topic .tc{color:var(--muted);font-size:13px}
.topic .bar{margin:0}
.chev{color:var(--dim);font-size:22px;text-align:right}

/* overlay screens */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .wrap{max-width:620px;margin:0 auto;padding:calc(var(--st) + 12px) 18px calc(var(--sb) + 150px);min-height:100%}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x{width:38px;height:38px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px;color:var(--muted);flex:none}
.prog{flex:1;height:8px;background:var(--panel);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--signal);transition:width .35s}
.cnt{font-family:var(--round);font-weight:700;color:var(--muted);font-size:15px;min-width:52px;text-align:right}

/* question */
.qtag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.y{background:rgba(255,201,77,.14);color:var(--signal)}
.qtext{font-family:var(--round);font-size:22px;font-weight:700;line-height:1.25;margin-bottom:14px}
pre.code{margin:0 0 16px;background:var(--code);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px;font-family:var(--mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre;color:#DCE4F2}
pre.code.out{background:#0A0F1B;color:#C8F2DE;border-style:dashed}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:-6px 0 6px}
.k{color:#FF9DC2}.s{color:#9FE0A8}.nmb{color:#FFC27A}.c{color:#6F7D99;font-style:italic}.f{color:#8FC8FF}
.blank{display:inline-block;min-width:3.2em;padding:0 6px;border-radius:6px;background:rgba(255,201,77,.18);border-bottom:2px solid var(--signal);color:var(--signal);text-align:center}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:17px;line-height:1.35}
.opt:active{background:var(--panel2)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:14px;color:var(--muted)}
.opt pre{margin:0;font-family:var(--mono);font-size:15px;white-space:pre-wrap;line-height:1.45}
.opt.right{border-color:var(--ok);background:rgba(70,211,160,.10)}
.opt.right .key{background:var(--ok);color:#06281C}
.opt.wrong{border-color:var(--bad);background:rgba(255,123,123,.10)}
.opt.wrong .key{background:var(--bad);color:#3A0909}
.opt.fade{opacity:.5}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-family:var(--round);font-weight:800;font-size:20px;padding:22px 10px}

.bugcode{background:var(--code);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.bugline{display:grid;grid-template-columns:34px 1fr;width:100%;text-align:left;font-family:var(--mono);font-size:15px;border-top:1px solid #1A2338;min-height:46px;align-items:center}
.bugline:first-child{border-top:0}
.bugline .ln{color:var(--dim);text-align:right;padding-right:10px;font-size:13px}
.bugline pre{margin:0;padding:10px 10px 10px 0;white-space:pre;overflow-x:auto;color:#DCE4F2}
.bugline.right{background:rgba(70,211,160,.16)}
.bugline.wrong{background:rgba(255,123,123,.16)}

.tiles{display:flex;flex-direction:column;gap:8px}
.answerbox{min-height:64px;border:2px dashed var(--line);border-radius:var(--r-md);padding:8px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;background:var(--code)}
.answerbox .ph{color:var(--dim);font-size:14px;padding:12px 6px}
.tile{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:15px}
.tile pre{margin:0;white-space:pre;overflow-x:auto}
.tile.used{visibility:hidden;height:0;padding:0;border:0;margin:-4px 0}
.answerbox .tile{background:#1A2540}
.answerbox .tile.right{border-color:var(--ok)}
.answerbox .tile.wrong{border-color:var(--bad)}

.inp{width:100%;font:inherit;font-size:20px;font-family:var(--mono);padding:14px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--panel);color:var(--text)}
.inp.right{border-color:var(--ok)}.inp.wrong{border-color:var(--bad)}
textarea.inp{font-family:var(--sans);font-size:17px;min-height:110px;resize:vertical}

.flip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;width:100%}
.flip .front{font-family:var(--round);font-size:26px;font-weight:800}
.flip .back{font-size:18px;line-height:1.45;color:var(--text);border-top:1px solid var(--line);padding-top:14px}
.flip .hint{color:var(--muted);font-size:14px}
.model{background:rgba(143,180,255,.09);border:1px solid rgba(143,180,255,.35);border-radius:var(--r-md);padding:14px;margin-top:12px}
.model .lbl{margin:0 0 6px;color:var(--half)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate button{padding:14px 6px;border-radius:12px;font-weight:700;font-size:15px;background:var(--panel2);border:2px solid transparent}
.rate .r0{border-color:rgba(255,123,123,.6)}
.rate .r1{border-color:rgba(143,180,255,.6)}
.rate .r2{border-color:rgba(70,211,160,.6)}

/* bottom action + feedback sheet */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 18px calc(var(--sb) + 14px);background:linear-gradient(to top,var(--bg) 70%,rgba(19,28,46,0))}
.dock .in{max-width:620px;margin:0 auto}
.dock .primary{margin:0}
.dock .primary[disabled]{background:var(--panel2);color:var(--dim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:3px solid var(--ok);border-radius:22px 22px 0 0;padding:18px 18px calc(var(--sb) + 14px);box-shadow:0 -12px 40px rgba(0,0,0,.35);animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:72dvh;overflow-y:auto}
.sheet.bad{border-top-color:var(--bad)}
.sheet.half{border-top-color:var(--half)}
.sheet .in{max-width:620px;margin:0 auto}
.sheet h3{font-size:22px;margin-bottom:6px}
.sheet.good h3{color:var(--ok)}.sheet.bad h3{color:var(--bad)}.sheet.half h3{color:var(--half)}
.why{font-size:16px;line-height:1.45;margin-bottom:12px}
.fixline{font-family:var(--mono);font-size:15px;background:var(--code);border-radius:10px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;color:#C8F2DE}
.again{font-size:13.5px;color:var(--muted);margin:-4px 0 12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* lesson */
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px}
.lcard h2{margin-bottom:12px}
.lb{font-size:17px;line-height:1.55}
.lb p{margin:0 0 .75em}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 0;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--signal);width:20px;border-radius:4px}

/* summary */
.score{text-align:center;padding:26px 0 8px}
.score .big{font-family:var(--round);font-size:64px;font-weight:800;line-height:1}
.score .grade{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--panel2);font-weight:700}
.misslist{display:flex;flex-direction:column;gap:8px}
.miss{background:var(--panel);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:15px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.kpi .v{font-family:var(--round);font-size:30px;font-weight:800;line-height:1.05}
.kpi .l{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.days{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:12px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.days .col{width:100%;border-radius:5px 5px 2px 2px;background:var(--panel2);min-height:3px;position:relative;overflow:hidden}
.days .col i{position:absolute;left:0;right:0;bottom:0;background:var(--signal)}
.days .d span{font-size:11px;color:var(--dim)}
.days .d.today span{color:var(--signal);font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.heat .hrow .hn{font-weight:700;margin-bottom:6px;font-size:15px}
.heat .cells{display:flex;flex-wrap:wrap;gap:6px}
.heat .cell{font-size:12.5px;padding:6px 9px;border-radius:8px;font-weight:600}
.typerow{display:grid;grid-template-columns:1fr 70px 46px;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.typerow .bar{margin:0}
.typerow b{text-align:right;font-family:var(--round)}
.weak{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.weak button{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:10px;padding:12px;text-align:left;width:100%}
.weak .w2{color:var(--bad);font-weight:700;font-family:var(--round)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 11px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--signal);color:var(--signal-ink)}
.btn2{background:var(--panel2);padding:11px 14px;border-radius:10px;font-weight:700;font-size:15px}
.btn2.danger{color:var(--bad)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,9,18,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--panel);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--sb) + 18px);max-height:88dvh;overflow-y:auto}
.modal h2{margin-bottom:10px}
.steps{padding-left:20px;margin:8px 0 0}
.steps li{margin-bottom:8px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>const DB={"Q":[{"ch":0,"tp":"alap","t":"card","front":"Program","back":"Utasítások sorozata, amelyet a számítógép végre tud hajtani.","id":"0e838449"},{"ch":0,"tp":"alap","t":"card","front":"Algoritmus","back":"Egy feladat megoldásának lépésről lépésre leírt módja. Nem feltétlenül számítógépes: egy recept vagy útleírás is algoritmus.","id":"330287c8"},{"ch":0,"tp":"alap","t":"card","front":"Programozás","back":"Az algoritmus leírása olyan nyelven, amelyet a számítógép „megért”.","id":"13b37edb"},{"ch":0,"tp":"alap","t":"card","front":"Bug és debuggolás","back":"A bug a programhiba (angolul: bogár). A debuggolás a hibakeresés és -javítás.","id":"4a108a9d"},{"ch":0,"tp":"alap","t":"card","front":"Szekvencia (sorrend)","back":"Az utasítások fentről lefelé, egymás után, egyesével hajtódnak végre.","id":"601ca034"},{"ch":0,"tp":"alap","t":"card","front":"A programok három építőköve","back":"Sorrend (szekvencia), elágazás (szelekció) és ismétlés (ciklus, iteráció).","id":"2c5abe2e"},{"ch":0,"tp":"alap","t":"card","front":"Paraméter / argumentum","back":"Az az érték, amit egy függvénynek a zárójelben átadunk. A print(\"Szia\") hívásban a \"Szia\" az argumentum.","id":"1a600c9c"},{"ch":0,"tp":"alap","t":"mc","q":"Mi az algoritmus?","o":["Egy feladat megoldásának lépésről lépésre leírt módja","Egy programozási nyelv","A számítógép processzora","Egy hibaüzenet"],"a":0,"why":"Az algoritmus a megoldás menete, lépésekben. Ez még nem feltétlenül program: egy palacsintarecept is algoritmus.","id":"48384a1a"},{"ch":0,"tp":"alap","t":"mc","q":"A recept–program hasonlatban mi felel meg a hozzávalóknak?","o":["A bemenet (adatok)","A program (utasítások)","A kimenet (eredmény)","A fordító"],"a":0,"why":"Hozzávalók = bemenet, recept lépései = program, kész étel = kimenet.","id":"70570dd6"},{"ch":0,"tp":"alap","t":"mc","q":"Melyik NEM a programok három alapvető építőköve közül való?","o":["Fordítás","Sorrend","Elágazás","Ismétlés"],"a":0,"why":"A három építőkő: sorrend, elágazás, ismétlés. A fordítás az, ahogy a programból gépi kód lesz – az nem építőkő.","id":"9952a95d"},{"ch":0,"tp":"alap","t":"tf","q":"Ha a program nem azt csinálja, amit szerettem volna, általában a gép rontotta el.","a":false,"why":"Szinte mindig az utasításban van a hiba. A gép szó szerint azt csinálja, amit leírtunk.","id":"fc89c3b0"},{"ch":0,"tp":"alap","t":"tf","q":"A számítógép az utasításokat a leírás sorrendjében, egyszerre csak egyet hajt végre.","a":true,"why":"Ez a szekvencia: fentről lefelé, egymás után.","id":"c843c5d1"},{"ch":0,"tp":"alap","t":"mc","q":"Mit csinál a print függvény?","o":["Kiírja a képernyőre, amit kap","Kinyomtatja nyomtatón","Bekér egy adatot","Elment egy fájlt"],"a":0,"why":"A „print” angolul nyomtatást jelent, de a programban a képernyőre ír.","id":"e7001be4"},{"ch":0,"tp":"alap","t":"mc","q":"Mit csinál az input függvény?","o":["Megvárja, amíg a felhasználó begépel valamit és Entert nyom","Kiír egy szöveget","Leállítja a programot","Összead két számot"],"a":0,"why":"Az input bekér egy választ a felhasználótól, és visszaadja (szövegként).","id":"976f3a39"},{"ch":0,"tp":"alap","t":"out","q":"Mit ír ki ez a program?","code":"print(\"Helló, világ!\")","o":["Helló, világ!","\"Helló, világ!\"","print Helló, világ!","Semmit"],"a":0,"why":"Az idézőjelek csak jelzik, hogy szöveg; kiíráskor nem jelennek meg.","id":"f7216d70"},{"ch":0,"tp":"alap","t":"mc","q":"A print(\"Szia\") hívásban mi a \"Szia\"?","o":["Argumentum (paraméter)","Függvény","Változó","Operátor"],"a":0,"why":"Amit a zárójelben átadunk a függvénynek, az az argumentum.","id":"ce4af14d"},{"ch":0,"tp":"alap","t":"mc","q":"A felhasználó „Anna”-t ír be. Mi lesz a második sor kimenete?","code":"nev = input(\"Hogy hívnak? \")\nprint(\"Szia, \" + nev + \"!\")","o":["Szia, Anna!","Szia, nev!","Szia,Anna!","Szia, + nev + !"],"a":0,"why":"A nev változóban „Anna” van, a + összefűzi a szövegdarabokat.","id":"019cc374"},{"ch":0,"tp":"alap","t":"mc","q":"Mi alakítja át a programozási nyelven írt programot a gép nyelvére?","o":["A fordító vagy értelmező","A print függvény","A processzor hűtője","A felhasználó"],"a":0,"why":"A fordító (vagy értelmező) a hidat jelenti az ember által olvasható kód és a gépi kód között.","id":"8c5c7a76"},{"ch":0,"tp":"alap","t":"mc","q":"Hibaüzenetet kaptál. Általában melyik sorát érdemes először elolvasni?","o":["Az utolsót","Az elsőt","Egyiket sem","A középsőt"],"a":0,"why":"A hibaüzenet utolsó sora mondja meg a hiba fajtáját, pl. NameError, TypeError.","id":"b7827e92"},{"ch":0,"tp":"alap","t":"exp","q":"Magyarázd el saját szavaiddal, miért mondjuk, hogy a számítógép „gyors, de buta”!","model":"Másodpercenként milliárdnyi műveletet végez és nem fárad el, de nincs józan esze: nem találja ki, mire gondoltunk, csak pontosan azt hajtja végre, amit leírtunk. Ezért kellenek pontos, egyértelmű, jó sorrendű utasítások.","id":"862401b2"},{"ch":0,"tp":"alap","t":"exp","q":"Írd le egy hétköznapi tevékenység algoritmusát (pl. teafőzés) 4–5 lépésben!","model":"Például: 1. Tölts vizet a vízforralóba. 2. Kapcsold be, várd meg, míg felforr. 3. Tegyél filtert a bögrébe. 4. Öntsd rá a vizet. 5. Várj 3 percet, vedd ki a filtert. A lényeg: pontos, egyértelmű lépések, jó sorrendben.","id":"d8a8650b"},{"ch":0,"tp":"alap","t":"order","q":"Rakd sorrendbe: a program kérje be a nevet, aztán köszönjön!","lines":["nev = input(\"Név: \")","print(\"Szia, \" + nev)"],"why":"Előbb kell a dobozba tenni a nevet, csak utána lehet használni. Ez a szekvencia.","id":"299625c8"},{"ch":1,"tp":"helyiertek","t":"card","front":"Helyiértékes írásmód","back":"A számjegy értéke attól függ, hol áll. A 4735-ben a 4 négyezret ér: 4·1000 + 7·100 + 3·10 + 5·1.","id":"2d80c5ad"},{"ch":1,"tp":"helyiertek","t":"card","front":"Alapszám","back":"Megmutatja, hány számjegyet használ a számrendszer, és hányszorosa minden helyiérték a jobb szomszédjának. Tízes: 10, kettes: 2, tizenhatos: 16.","id":"c5a85331"},{"ch":1,"tp":"binaris","t":"card","front":"Bit","back":"A legkisebb információegység (binary digit), értéke 0 vagy 1.","id":"004712dc"},{"ch":1,"tp":"binaris","t":"card","front":"Bájt","back":"8 bit. Összesen 256 különböző értéket tárolhat: 0-tól 255-ig.","id":"36e85745"},{"ch":1,"tp":"binaris","t":"card","front":"Bináris helyiértékek","back":"Jobbról balra: 1, 2, 4, 8, 16, 32, 64, 128 … mindegyik az előző duplája.","id":"fc040461"},{"ch":1,"tp":"hexa","t":"card","front":"Hexadecimális számjegyek","back":"0–9, majd A=10, B=11, C=12, D=13, E=14, F=15. Egy hexa jegy = pontosan 4 bit.","id":"742015c0"},{"ch":1,"tp":"hexa","t":"card","front":"0x és 0b előtag","back":"0x = hexadecimális szám (0xFF), 0b = bináris szám (0b1101). Így különböztetjük meg őket a tízes számoktól.","id":"c8a483ce"},{"ch":1,"tp":"karakter","t":"card","front":"Karakterkódolás (ASCII, Unicode)","back":"Megállapodás, hogy melyik karakternek melyik szám a kódja. ASCII-ban \"A\"=65, \"a\"=97. Az Unicode (UTF-8) az ékezetes betűket is tartalmazza.","id":"d1d1d986"},{"ch":1,"tp":"helyiertek","t":"mc","q":"A 4735 számban mennyit ér a 7-es?","o":["700","7","70","7000"],"a":0,"why":"A 7 a százasok helyén áll: 7 · 100 = 700.","id":"49466517"},{"ch":1,"tp":"helyiertek","t":"mc","q":"Miért kettes számrendszert használ a számítógép?","o":["Mert kapcsolókból áll, amelyeknek két állapota van (ki/be)","Mert így gyorsabban lehet osztani","Mert a programozók így szeretik","Mert a 2 a legkisebb prímszám"],"a":0,"why":"Két feszültségszintet (van áram / nincs) könnyű megbízhatóan megkülönböztetni, tízet nagyon nehéz.","id":"8d8ba1ac"},{"ch":1,"tp":"binaris","t":"mc","q":"Mennyi a 101101 bináris szám tízes alakja?","o":["45","47","41","90"],"a":0,"why":"32 + 8 + 4 + 1 = 45. Csak ott adunk össze, ahol 1-es áll.","id":"89ecf429"},{"ch":1,"tp":"binaris","t":"type","q":"Mennyi az 1010 bináris szám tízes alakja?","a":["10"],"why":"8 + 2 = 10.","id":"3782e28b"},{"ch":1,"tp":"binaris","t":"type","q":"Mennyi a 1111 bináris szám tízes alakja?","a":["15"],"why":"8 + 4 + 2 + 1 = 15. Négy biten ez a legnagyobb szám.","id":"c14985d4"},{"ch":1,"tp":"binaris","t":"type","q":"Mennyi a 11111111 bináris szám tízes alakja?","a":["255"],"why":"128+64+32+16+8+4+2+1 = 255, a legnagyobb bájt-érték.","id":"bb63de9c"},{"ch":1,"tp":"binaris","t":"type","q":"Írd fel a 25-öt kettes számrendszerben!","a":["11001","0b11001"],"why":"25 = 16 + 8 + 1 → 11001.","id":"e1fedef0"},{"ch":1,"tp":"binaris","t":"type","q":"Írd fel a 37-et kettes számrendszerben!","a":["100101","0b100101"],"why":"37 = 32 + 4 + 1 → 100101. Ellenőrzés: visszaváltva 37.","id":"97038c33"},{"ch":1,"tp":"binaris","t":"mc","q":"Mi a 6 bináris alakja?","o":["110","101","011","111"],"a":0,"why":"6 = 4 + 2 → 110.","id":"3ec21bcd"},{"ch":1,"tp":"binaris","t":"mc","q":"Az ismételt 2-vel osztásos módszernél hogyan olvassuk ki az eredményt?","o":["A maradékokat alulról felfelé","A hányadosokat felülről lefelé","A maradékokat felülről lefelé","A hányadosokat alulról felfelé"],"a":0,"why":"Az utolsó maradék lesz a legelső (legnagyobb helyiértékű) bit.","id":"a86c11aa"},{"ch":1,"tp":"binaris","t":"mc","q":"Hány különböző értéket lehet tárolni 4 biten?","o":["16","4","8","15"],"a":0,"why":"2⁴ = 16 különböző érték (0-tól 15-ig).","id":"f3f5a17f"},{"ch":1,"tp":"binaris","t":"mc","q":"Mi a legnagyobb nem negatív szám, ami elfér 8 biten?","o":["255","256","128","127"],"a":0,"why":"8 biten 256 érték van, 0-tól indulva a legnagyobb a 255.","id":"d3be6666"},{"ch":1,"tp":"binaris","t":"tf","q":"n biten 2ⁿ különböző érték tárolható.","a":true,"why":"Minden új bit megduplázza a lehetőségek számát.","id":"6649c9f9"},{"ch":1,"tp":"binaris","t":"mc","q":"Mennyi 1 + 1 kettes számrendszerben?","o":["10","2","11","0"],"a":0,"why":"1 + 1 = 10 (olvasd: egy-nulla): 0 marad, 1 átvitel a következő helyre.","id":"b31e7f6b"},{"ch":1,"tp":"binaris","t":"mc","q":"Mennyi 0110 + 0011 binárisan?","o":["1001","0111","1010","1100"],"a":0,"why":"6 + 3 = 9 = 1001.","id":"001a37b7"},{"ch":1,"tp":"binaris","t":"mc","q":"Mit jelent a túlcsordulás?","o":["A szám nem fér el a rendelkezésre álló biteken","A program túl sokáig fut","Elfogy a memória","Túl sok a print utasítás"],"a":0,"why":"A számítógépes számoknak véges méretük van; ami nem fér el, az hibás eredményt adhat.","id":"838066ec"},{"ch":1,"tp":"hexa","t":"mc","q":"Mennyi a hexadecimális D6 tízes alakja?","o":["214","136","206","166"],"a":0,"why":"D = 13 → 13·16 + 6 = 208 + 6 = 214.","id":"7c196a57"},{"ch":1,"tp":"hexa","t":"mc","q":"Melyik hexa számjegy jelenti a 12-t?","o":["C","B","D","12"],"a":0,"why":"A=10, B=11, C=12, D=13, E=14, F=15.","id":"c380b377"},{"ch":1,"tp":"hexa","t":"type","q":"Mennyi a hexadecimális FF tízes alakja?","a":["255"],"why":"15·16 + 15 = 255. Egy bájt legnagyobb értéke.","id":"6fd9bfd1"},{"ch":1,"tp":"hexa","t":"mc","q":"Hány bit felel meg egy hexadecimális számjegynek?","o":["4","8","2","16"],"a":0,"why":"2⁴ = 16, ezért egy hexa jegy pontosan 4 bitet ír le.","id":"0b35b8fc"},{"ch":1,"tp":"hexa","t":"mc","q":"Mi az 1010 1111 bináris szám hexadecimális alakja?","o":["AF","FA","A15","10F"],"a":0,"why":"Négyes csoportok: 1010 = A, 1111 = F → AF.","id":"77f22b4a"},{"ch":1,"tp":"hexa","t":"mc","q":"Az #FF8800 színkódban mennyi a zöld összetevő tízesben?","o":["136","88","255","0"],"a":0,"why":"A három bájt: vörös FF, zöld 88, kék 00. 88 hexa = 8·16 + 8 = 136.","id":"48afce63"},{"ch":1,"tp":"hexa","t":"tf","q":"A hexadecimális számokat azért használjuk, mert rövidebbek és jobban olvashatók, mint a hosszú bináris sorok.","a":true,"why":"A 11010110 helyett elég azt írni: D6.","id":"8fdbee15"},{"ch":1,"tp":"python","t":"out","q":"Mit ír ki?","code":"print(bin(37))","o":["0b100101","100101","37","0x25"],"a":0,"why":"A bin() eredménye elé a Python a 0b előtagot teszi, jelezve, hogy bináris.","id":"178edaca"},{"ch":1,"tp":"python","t":"out","q":"Mit ír ki?","code":"print(hex(214))","o":["0xd6","D6","0b214","214"],"a":0,"why":"A hex() kisbetűvel és 0x előtaggal adja: 0xd6.","id":"97d8b3bd"},{"ch":1,"tp":"python","t":"out","q":"Mit ír ki?","code":"print(int(\"100101\", 2))","o":["37","100101","2","45"],"a":0,"why":"Az int második paramétere megmondja, hányas számrendszerben értelmezze a szöveget: kettesben → 37.","id":"f0b99bd8"},{"ch":1,"tp":"python","t":"out","q":"Mit ír ki?","code":"print(int(\"D6\", 16))","o":["214","D6","16","0xd6"],"a":0,"why":"A \"D6\" tizenhatos számrendszerben 214.","id":"cdfdba8a"},{"ch":1,"tp":"python","t":"out","q":"Mit ír ki?","code":"print(0b1101, 0xD6)","o":["13 214","0b1101 0xD6","1101 D6","13214"],"a":0,"why":"A kódban 0b és 0x előtaggal is írhatsz számot, a print tízesben írja ki őket.","id":"666e631e"},{"ch":1,"tp":"python","t":"fill","q":"Egészítsd ki, hogy a \"FF\" hexa szöveget alakítsa számmá!","code":"print(int(\"FF\", ___))","o":["16","2","10","\"hex\""],"a":0,"why":"Az int második paramétere az alapszám: 16 a hexadecimálishoz.","id":"0517d3d0"},{"ch":1,"tp":"python","t":"mc","q":"Melyik függvény váltja át a tízes számot binárisra Pythonban?","o":["bin()","hex()","int()","ord()"],"a":0,"why":"bin() → bináris, hex() → hexadecimális, int(szöveg, alap) → vissza tízesre.","id":"378e70a6"},{"ch":1,"tp":"karakter","t":"out","q":"Mit ír ki?","code":"print(ord(\"A\"))","o":["65","97","A","1"],"a":0,"why":"Az ord() a karakter kódját adja. A nagy A kódja 65.","id":"654aa654"},{"ch":1,"tp":"karakter","t":"out","q":"Mit ír ki?","code":"print(chr(66))","o":["B","66","A","b"],"a":0,"why":"A chr() a számhoz tartozó karaktert adja: 66 → B.","id":"da0b7e04"},{"ch":1,"tp":"karakter","t":"mc","q":"Mi a kisbetűs \"a\" ASCII-kódja?","o":["97","65","1","32"],"a":0,"why":"Nagy A = 65, kis a = 97. A kis- és nagybetűk kódja különbözik!","id":"055fd8b1"},{"ch":1,"tp":"karakter","t":"tf","q":"A szöveget is számok formájában tárolja a számítógép.","a":true,"why":"Minden karakterhez tartozik egy szám (kód), ezt tárolja a gép.","id":"f00938e2"},{"ch":1,"tp":"binaris","t":"exp","q":"Magyarázd el a villanykapcsolós hasonlattal, miért nő a tárolható információ a bitek számával!","model":"Egy kapcsolóval 2 állapot jelezhető (világos/sötét). Kettővel 4, hárommal 8: minden újabb kapcsoló megduplázza a lehetséges kombinációkat. n kapcsolóval (bittel) 2ⁿ állapot írható le.","id":"7472edf8"},{"ch":1,"tp":"binaris","t":"exp","q":"Írd le lépésenként, hogyan váltod át a 13-at binárisra a „kivonogatós” módszerrel!","model":"Helyiértékek: 8, 4, 2, 1. A 8 belefér (13−8=5) → 1. A 4 belefér (5−4=1) → 1. A 2 nem fér bele → 0. Az 1 belefér (1−1=0) → 1. Eredmény: 1101. Ellenőrzés: 8+4+1 = 13.","id":"a7b4f2bb"},{"ch":2,"tp":"valtozo","t":"card","front":"Változó","back":"Névvel ellátott „doboz”, amelyben egy értéket tárolunk. Az értéke bármikor felülírható; ilyenkor a régi elvész.","id":"4867318c"},{"ch":2,"tp":"valtozo","t":"card","front":"Értékadás ( = )","back":"Utasítás, nem egyenlőség! „A jobb oldal értékét tedd a bal oldali dobozba.” Olvasd így: a kor legyen 15.","id":"14390d19"},{"ch":2,"tp":"valtozo","t":"card","front":"Megjegyzés ( # )","back":"A # utáni rész a sor végéig a gépnek láthatatlan; az embernek szól.","id":"d79be933"},{"ch":2,"tp":"aritm","t":"card","front":"Operátor és operandus","back":"Az operátor a műveleti jel (pl. +), az operandusok azok az értékek, amelyeken dolgozik. 3 + 4: + az operátor, 3 és 4 az operandus.","id":"93da0a4e"},{"ch":2,"tp":"aritm","t":"card","front":"Kifejezés","back":"Olyan szerkezet, amelyből a gép egy értéket számol ki: 2 + 3 * 4, de egy változónév (kor) is kifejezés.","id":"b06827a4"},{"ch":2,"tp":"aritm","t":"card","front":"// és %","back":"// az egészosztás (hányszor fér bele), % a maradék. 17 // 5 = 3, 17 % 5 = 2.","id":"553910be"},{"ch":2,"tp":"logikai","t":"card","front":"and, or, not","back":"and: igaz, ha mindkettő igaz. or: igaz, ha legalább az egyik igaz. not: megfordítja az értéket.","id":"d89a6cba"},{"ch":2,"tp":"logikai","t":"card","front":"Rövidzár-kiértékelés","back":"Ha az and/or bal oldala már eldönti az eredményt (pl. False and …), a jobb oldalt a Python meg sem vizsgálja.","id":"b8b6d404"},{"ch":2,"tp":"valtozo","t":"mc","q":"Melyik érvényes változónév Pythonban?","o":["szemelyi_szam","2szam","for","kor ev"],"a":0,"why":"Számjeggyel nem kezdődhet, nem lehet foglalt szó (for), és nem lehet benne szóköz.","id":"6a181c26"},{"ch":2,"tp":"valtozo","t":"mc","q":"Miért hibás a „2kor” változónév?","o":["Számjeggyel kezdődik","Túl rövid","Kisbetűs","Van benne szám"],"a":0,"why":"Lehet benne számjegy, de nem az elején.","id":"7a6eb3f8"},{"ch":2,"tp":"valtozo","t":"tf","q":"A kor és a Kor ugyanaz a változó Pythonban.","a":false,"why":"A kis- és nagybetű különbözik: ez két külön változó.","id":"f9b62263"},{"ch":2,"tp":"valtozo","t":"out","q":"Mit ír ki?","code":"kor = 15\nkor = 16\nprint(kor)","o":["16","15","15 16","31"],"a":0,"why":"Az értékadás felülírja a doboz tartalmát; a régi 15 elveszett.","id":"81e3d4aa"},{"ch":2,"tp":"valtozo","t":"out","q":"Mit ír ki?","code":"nev = \"Anna\"\nkor = 15\nprint(nev, kor)","o":["Anna 15","Anna15","nev kor","\"Anna\" 15"],"a":0,"why":"A print vesszővel elválasztott értékeit szóközzel írja egymás mellé.","id":"184e3af6"},{"ch":2,"tp":"valtozo","t":"mc","q":"Milyen hibát kapsz, ha olyan változót használsz, aminek még nem adtál értéket?","o":["NameError","TypeError","IndentationError","SyntaxError"],"a":0,"why":"NameError: name ... is not defined – nincs ilyen nevű doboz. Nézd meg, nem gépelted-e el.","id":"934c31cd"},{"ch":2,"tp":"valtozo","t":"bug","q":"Melyik sor okoz hibát?","code":"osszeg = 10\nprint(osszeg)\nprint(Osszeg)","a":2,"fix":"print(osszeg)","why":"Az Osszeg nagy O-val egy másik, nem létező változó → NameError.","id":"d80a54d5"},{"ch":2,"tp":"valtozo","t":"mc","q":"Mit jelent a # jel a kódban?","o":["Utána megjegyzés következik, a gép figyelmen kívül hagyja","Számot jelöl","Szorzást jelent","Kommentként futtatja a sort"],"a":0,"why":"A # utáni szöveg nekünk, embereknek szól.","id":"57f6d391"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(7 / 2)","o":["3.5","3","4","3,5"],"a":0,"why":"Pythonban a / mindig törtszámot ad.","id":"8ba2fcde"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(7 // 2)","o":["3","3.5","4","1"],"a":0,"why":"A // egészosztás: hányszor fér bele a 2 a 7-be → 3.","id":"52db311c"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(7 % 2)","o":["1","3","3.5","0"],"a":0,"why":"A % a maradék: 7 = 3·2 + 1.","id":"f37739d4"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(7 ** 2)","o":["49","14","9","72"],"a":0,"why":"A ** a hatványozás: 7² = 49.","id":"44eb4599"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(17 // 5)\nprint(17 % 5)","o":["3\n2","2\n3","3.4\n2","3\n0"],"a":0,"why":"17 cukorka, 5 gyerek: mindenki 3-at kap (//), 2 marad (%).","id":"a0acaec9"},{"ch":2,"tp":"aritm","t":"out","q":"Mit ír ki?","code":"print(6 / 2)","o":["3.0","3","6/2","2"],"a":0,"why":"Az osztás akkor is törtet ad, ha kerek az eredmény.","id":"b886a2e3"},{"ch":2,"tp":"aritm","t":"type","q":"Mennyi 20 % 6?","a":["2"],"why":"20 = 3·6 + 2, a maradék 2.","id":"9272a39a"},{"ch":2,"tp":"aritm","t":"type","q":"Mennyi 15 % 12? (gondolj az órára)","a":["3"],"why":"15 óra a 12 órás számlapon 3 óra.","id":"07b49ea4"},{"ch":2,"tp":"aritm","t":"type","q":"Mennyi 2 ** 5?","a":["32"],"why":"2·2·2·2·2 = 32.","id":"f9dc2790"},{"ch":2,"tp":"aritm","t":"mc","q":"Hogyan döntöd el, hogy a szam páros-e?","o":["szam % 2 == 0","szam / 2 == 0","szam // 2 == 1","szam % 2 == 1"],"a":0,"why":"Páros, ha a 2-vel vett maradéka 0.","id":"f2e2770a"},{"ch":2,"tp":"aritm","t":"mc","q":"Mit vizsgál a szam % 5 == 0?","o":["Osztható-e a szám 5-tel","Kisebb-e 5-nél","Egyenlő-e 5-tel","Páratlan-e"],"a":0,"why":"Ha 5-tel osztva nincs maradék, a szám osztható 5-tel.","id":"a6ab5e78"},{"ch":2,"tp":"aritm","t":"tf","q":"C-ben és Javában két egész szám osztása (7 / 2) egész eredményt ad: 3.","a":true,"why":"Ott a tizedesrész elveszik – erre figyelj, ha más nyelvre váltasz. Pythonban 3.5.","id":"d92d5f65"},{"ch":2,"tp":"sorrend","t":"out","q":"Mit ír ki?","code":"print(2 + 3 * 4)","o":["14","20","24","9"],"a":0,"why":"Előbb a szorzás: 3·4 = 12, aztán 2 + 12 = 14.","id":"660c821c"},{"ch":2,"tp":"sorrend","t":"out","q":"Mit ír ki?","code":"print((2 + 3) * 4)","o":["20","14","24","9"],"a":0,"why":"A zárójel a legerősebb: 5 · 4 = 20.","id":"3b659545"},{"ch":2,"tp":"sorrend","t":"out","q":"Mit ír ki?","code":"print(10 - 4 - 3)","o":["3","9","-3","1"],"a":0,"why":"Balról jobbra: (10 − 4) − 3 = 3.","id":"c60e7f4e"},{"ch":2,"tp":"sorrend","t":"out","q":"Mit ír ki?","code":"print(2 + 3 ** 2)","o":["11","25","10","13"],"a":0,"why":"A hatvány erősebb: 3² = 9, 2 + 9 = 11.","id":"642f327d"},{"ch":2,"tp":"sorrend","t":"out","q":"Mit ír ki?","code":"print(20 - 2 * 3 ** 2)","o":["2","324","162","-16"],"a":0,"why":"Hatvány: 9, szorzás: 18, kivonás: 20 − 18 = 2.","id":"bab24a40"},{"ch":2,"tp":"sorrend","t":"mc","q":"Melyik a legerősebb (először kiértékelt) az alábbiak közül?","o":["**","*","+","=="],"a":0,"why":"Sorrend: zárójel, **, * / // %, + -, összehasonlítás, not, and, or.","id":"1e5d6abc"},{"ch":2,"tp":"sorrend","t":"mc","q":"Ha nem vagy biztos a műveleti sorrendben, mit érdemes tenni?","o":["Zárójelet használni","Több sorba írni minden számot","Mindig balról jobbra számolni","Nem használni szorzást"],"a":0,"why":"A zárójel nem lassít, és egyértelművé teszi a szándékot.","id":"37a7b17a"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki?","code":"x = 5\nx = x + 1\nprint(x)","o":["6","5","Hiba","x + 1"],"a":0,"why":"Előbb a jobb oldal: 5 + 1 = 6, aztán ez kerül x-be.","id":"354ce2de"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki?","code":"pont = 10\npont += 5\npont *= 2\nprint(pont)","o":["30","25","20","15"],"a":0,"why":"10 + 5 = 15, majd 15 · 2 = 30.","id":"31919571"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki?","code":"x = 10\nx //= 3\nprint(x)","o":["3","3.33","1","30"],"a":0,"why":"x = x // 3 → 10 // 3 = 3.","id":"08bed0f9"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki?","code":"x = 10\nx %= 3\nprint(x)","o":["1","3","0","10"],"a":0,"why":"x = x % 3 → 10 % 3 = 1.","id":"72a57d68"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki?","code":"x = 10\nx /= 4\nprint(x)","o":["2.5","2","2.0","40"],"a":0,"why":"x = x / 4 → 2.5 (az osztás törtet ad).","id":"1ec80bad"},{"ch":2,"tp":"ertekadas","t":"mc","q":"Mit jelent az x -= 3?","o":["x = x - 3","x = -3","x = 3 - x","x == x - 3"],"a":0,"why":"Az összetett értékadás rövidítés: x -= 3 ugyanaz, mint x = x - 3.","id":"dd0932c3"},{"ch":2,"tp":"ertekadas","t":"bug","q":"Ez a program Pythonban hibás. Melyik sor a hibás?","code":"db = 0\ndb++\nprint(db)","a":1,"fix":"db += 1","why":"Pythonban nincs ++ operátor (C-ben, Javában van). Pythonban: db += 1.","id":"9f965e4d"},{"ch":2,"tp":"ertekadas","t":"tf","q":"Matematikailag az x = x + 1 lehetetlen, de a programozásban értelmes utasítás.","a":true,"why":"Az = nem egyenlőség, hanem értékadás: x eggyel nagyobb lesz.","id":"a05319a1"},{"ch":2,"tp":"ertekadas","t":"out","q":"Mit ír ki? (Ez a naiv csere)","code":"a = 3\nb = 8\na = b\nb = a\nprint(a, b)","o":["8 8","8 3","3 8","3 3"],"a":0,"why":"Az a = b után a régi 3 elveszett, így b is 8 lesz. Ezért kell segédváltozó!","id":"be760c38"},{"ch":2,"tp":"ertekadas","t":"order","q":"Rakd sorrendbe, hogy a és b értéke felcserélődjön (segédváltozóval)!","lines":["a = 3\nb = 8","seged = a","a = b","b = seged","print(a, b)"],"why":"Előbb a régi a-t elmentjük a segédbe, mint egy harmadik pohárba, csak utána írjuk felül.","id":"7dd780cf"},{"ch":2,"tp":"ertekadas","t":"fill","q":"Egészítsd ki a pythonos rövid cserét!","code":"a = 3\nb = 8\na, b = ___\nprint(a, b)","o":["b, a","a, b","b = a","a + b"],"a":0,"why":"Az a, b = b, a egy lépésben cseréli fel a két értéket.","id":"26ee95e4"},{"ch":2,"tp":"osszehas","t":"out","q":"Mit ír ki?","code":"print(5 != 5)","o":["False","True","5","Hiba"],"a":0,"why":"A != jelentése „nem egyenlő”. 5 nem egyenlő 5-tel? Hamis.","id":"7e252dc1"},{"ch":2,"tp":"osszehas","t":"out","q":"Mit ír ki?","code":"print(\"alma\" == \"Alma\")","o":["False","True","alma","Hiba"],"a":0,"why":"A nagybetű számít: a két szöveg nem egyforma.","id":"24042def"},{"ch":2,"tp":"osszehas","t":"out","q":"Mit ír ki?","code":"szam = 14\nprint(szam % 2 == 0)","o":["True","False","0","7"],"a":0,"why":"14 % 2 = 0, és 0 == 0 igaz → True.","id":"cccb5c65"},{"ch":2,"tp":"osszehas","t":"out","q":"Mit ír ki?","code":"print(\"alma\" < \"barack\")","o":["True","False","Hiba","alma"],"a":0,"why":"A szövegeket betűkód szerint (nagyjából abc-sorrendben) hasonlítja: az a előbb van, mint a b.","id":"d700859c"},{"ch":2,"tp":"osszehas","t":"mc","q":"Mi a különbség az = és a == között?","o":["= értéket ad, == összehasonlít","Semmi","== értéket ad, = összehasonlít","= csak számoknál működik"],"a":0,"why":"x = 5: „legyen 5”. x == 5: „5-e?” – ez a leggyakoribb kezdő hiba.","id":"35453815"},{"ch":2,"tp":"osszehas","t":"mc","q":"Milyen értéket ad egy összehasonlítás?","o":["True vagy False","Mindig számot","Szöveget","Semmit"],"a":0,"why":"Az összehasonlítás eredménye logikai érték: igaz vagy hamis.","id":"75034b40"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"kor = 20\nvan_jegye = True\nprint(kor >= 18 and van_jegye)","o":["True","False","20","Hiba"],"a":0,"why":"Mindkét feltétel igaz, így az and is igaz.","id":"5f98d3d6"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"kor = 20\nprint(kor < 18 or kor >= 65)","o":["False","True","20","Hiba"],"a":0,"why":"Egyik feltétel sem igaz, így az or is hamis.","id":"a38fd684"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"van_jegye = True\nprint(not van_jegye)","o":["False","True","not True","Hiba"],"a":0,"why":"A not megfordítja: True → False.","id":"736ecea1"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"kor = 20\nprint(18 <= kor < 65)","o":["True","False","Hiba","18"],"a":0,"why":"Pythonban láncolható az összehasonlítás: 18 ≤ 20 és 20 < 65 → igaz.","id":"991287fb"},{"ch":2,"tp":"logikai","t":"mc","q":"Mikor igaz az A and B?","o":["Ha mindkettő igaz","Ha legalább az egyik igaz","Ha mindkettő hamis","Mindig"],"a":0,"why":"Soros kapcsolás: a lámpa csak akkor ég, ha mindkét kapcsoló be van kapcsolva.","id":"06607e36"},{"ch":2,"tp":"logikai","t":"mc","q":"Mikor hamis az A or B?","o":["Ha mindkettő hamis","Ha az egyik hamis","Ha mindkettő igaz","Soha"],"a":0,"why":"Párhuzamos kapcsolás: elég az egyik. Csak akkor sötét, ha egyik sincs bekapcsolva.","id":"ff9b974a"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"print(True or False and False)","o":["True","False","Hiba","None"],"a":0,"why":"Az and erősebb, mint az or: False and False = False, majd True or False = True.","id":"4a333494"},{"ch":2,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"print((True or False) and False)","o":["False","True","Hiba","None"],"a":0,"why":"A zárójel előre hozza az or-t: True and False = False. Látod, a zárójel megváltoztatja az eredményt!","id":"6b8a143e"},{"ch":2,"tp":"logikai","t":"mc","q":"Mi a logikai operátorok kiértékelési sorrendje?","o":["not, and, or","or, and, not","and, or, not","balról jobbra, mind egyforma"],"a":0,"why":"Előbb a not, aztán az and, végül az or – hasonlóan, ahogy a szorzás megelőzi az összeadást.","id":"0a431d9d"},{"ch":2,"tp":"logikai","t":"mc","q":"Melyik a Python and operátorának megfelelője C-ben és Javában?","o":["&&","||","!","&"],"a":0,"why":"and → &&, or → ||, not → !","id":"4d4343e8"},{"ch":2,"tp":"logikai","t":"fill","q":"Kedvezmény jár, ha 18 alatti VAGY legalább 65 éves. Mi kerül a helyére?","code":"kor = 70\nprint(kor < 18 ___ kor >= 65)","o":["or","and","not","=="],"a":0,"why":"Elég, ha az egyik feltétel teljesül → or.","id":"a5dc660c"},{"ch":2,"tp":"aritm","t":"exp","q":"Magyarázd el a cukorkás példával, mi a különbség a // és a % között!","model":"17 cukorkát osztunk szét 5 gyerek között. A 17 // 5 = 3 megmondja, hány darabot kap mindenki (hányszor fér bele az 5 a 17-be). A 17 % 5 = 2 megmondja, mennyi marad szétosztás után.","id":"a914921e"},{"ch":2,"tp":"ertekadas","t":"exp","q":"Mi történik lépésenként az x = x + 1 utasításnál, ha x értéke 5?","model":"1. A gép kiszámolja a jobb oldalt: kiveszi x jelenlegi értékét (5), hozzáad egyet → 6. 2. Az eredményt beleteszi a bal oldali dobozba, x-be. A régi 5 elvész, x értéke 6 lesz.","id":"b7e026c6"},{"ch":2,"tp":"ertekadas","t":"exp","q":"Miért kell segédváltozó két változó cseréjéhez?","model":"Mert az a = b után a régi a értéke elveszik, és b = a már az új (b-vel egyező) értéket másolná vissza. A segédváltozó, mint egy harmadik pohár, megőrzi az eredeti értéket a cseréig.","id":"a1047594"},{"ch":3,"tp":"tipus","t":"card","front":"Adattípus","back":"Az értékek egy fajtája a rajtuk végezhető műveletekkel együtt. Megmondja, milyen fajta az érték és mit lehet vele csinálni.","id":"bdc4b1a0"},{"ch":3,"tp":"tipus","t":"card","front":"int, float, bool, str","back":"int: egész szám (42). float: tört szám (3.14). bool: logikai érték (True/False). str: szöveg (\"alma\").","id":"75d592b0"},{"ch":3,"tp":"szam","t":"card","front":"float pontatlansága","back":"Kettes számrendszerben a 0.1 végtelen tört, ezért kerekítés történik: 0.1 + 0.2 = 0.30000000000000004. Törteket ne hasonlíts ==-lel!","id":"cb680a6a"},{"ch":3,"tp":"szoveg","t":"card","front":"String (karakterlánc)","back":"Karakterek sorozata idézőjelek között: \"szia\" vagy 'szia'. A két idézőjel legyen egyforma.","id":"79114b30"},{"ch":3,"tp":"szoveg","t":"card","front":"Indexelés","back":"A karakterek sorszáma 0-tól indul. szo[0] az első, szo[-1] az utolsó karakter.","id":"6d225889"},{"ch":3,"tp":"szoveg","t":"card","front":"Szeletelés [a:b]","back":"Az a indextől a b ELŐTTI elemig tart. \"PROGRAM\"[1:4] = \"ROG\". A szelet hossza b − a.","id":"238f1427"},{"ch":3,"tp":"szoveg","t":"card","front":"f-string","back":"f\"...\" – a kapcsos zárójelbe írt változó/kifejezés értéke beíródik: f\"{nev} {kor} éves\".","id":"8a4c8008"},{"ch":3,"tp":"szoveg","t":"card","front":"Escape-szekvencia","back":"Visszaperjeles különleges jel a szövegben: \\n = új sor, \\\" = idézőjel.","id":"20ed1a85"},{"ch":3,"tp":"atalakitas","t":"card","front":"Statikus vs. dinamikus típusosság","back":"Statikus (C, Java): a változó típusát előre meg kell adni, és nem változhat. Dinamikus (Python): a típus az értékhez tartozik, a változó később más típust is kaphat.","id":"c957fcaf"},{"ch":3,"tp":"tipus","t":"out","q":"Mit ír ki?","code":"print(type(3.14))","o":["<class 'float'>","<class 'int'>","<class 'str'>","3.14"],"a":0,"why":"A 3.14 tört szám → float.","id":"46494f8d"},{"ch":3,"tp":"tipus","t":"out","q":"Mit ír ki?","code":"print(type(\"42\"))","o":["<class 'str'>","<class 'int'>","<class 'float'>","42"],"a":0,"why":"Idézőjelek között áll, tehát szöveg, akkor is, ha számjegyek vannak benne.","id":"500cbd41"},{"ch":3,"tp":"tipus","t":"out","q":"Mit ír ki?","code":"print(type(True))","o":["<class 'bool'>","<class 'str'>","<class 'int'>","True"],"a":0,"why":"True és False a logikai (bool) típus két értéke.","id":"ed5e9bb8"},{"ch":3,"tp":"tipus","t":"mc","q":"Milyen típusban tárolnád egy termék árát (pl. 2.5 euró)?","o":["float","int","bool","str"],"a":0,"why":"Tizedesrész van benne → tört szám (float). (Pénznél jobb lehet centben, egészként számolni.)","id":"5e8c53b0"},{"ch":3,"tp":"tipus","t":"mc","q":"Milyen típusban tárolnád, hogy „be van-e jelentkezve a felhasználó”?","o":["bool","int","str","float"],"a":0,"why":"Igen/nem kérdés → logikai érték.","id":"5d21bf72"},{"ch":3,"tp":"tipus","t":"mc","q":"Milyen típus az életkor?","o":["int","float","bool","str"],"a":0,"why":"Darabszám, életkor, sorszám tipikusan egész szám.","id":"d4fc7203"},{"ch":3,"tp":"tipus","t":"mc","q":"Melyik függvénnyel kérdezed le egy érték típusát?","o":["type()","int()","len()","print()"],"a":0,"why":"type(érték) megmondja a típust.","id":"d34b22a5"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(2 ** 100)","o":["1267650600228229401496703205376","Túlcsordulás hiba","200","0"],"a":0,"why":"A Python egész számai „nőnek” a szükséges méretig, nincs túlcsordulás.","id":"bf3d347f"},{"ch":3,"tp":"szam","t":"tf","q":"Javában egy 32 bites int is akármekkora számot tárolhat.","a":false,"why":"Javában az int 32 bites, legfeljebb 2 147 483 647. Ami nem fér el, túlcsordul. A Python egészei viszont nőnek.","id":"16fc3a82"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(0.1 + 0.2 == 0.3)","o":["False","True","0.3","Hiba"],"a":0,"why":"0.1 + 0.2 valójában 0.30000000000000004, ezért nem egyenlő 0.3-mal.","id":"94ae54f5"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(round(0.1 + 0.2, 2))","o":["0.3","0.30000000000000004","0.30","0"],"a":0,"why":"A round(x, 2) két tizedesjegyre kerekít.","id":"e6a6f8cb"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(int(3.99))","o":["3","4","3.99","3.0"],"a":0,"why":"Az int() levágja a törtrészt, NEM kerekít!","id":"01074f23"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(float(5))","o":["5.0","5","5,0","\"5\""],"a":0,"why":"A float() tört számmá alakít: 5 → 5.0.","id":"fb0edd1b"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(round(3.14159, 2))","o":["3.14","3.1","3","3.15"],"a":0,"why":"Két tizedesjegyre kerekít.","id":"3ec4742d"},{"ch":3,"tp":"szam","t":"out","q":"Mit ír ki?","code":"print(8 / 2)","o":["4.0","4","8/2","2"],"a":0,"why":"Az osztás mindig float-ot ad.","id":"b526fe82"},{"ch":3,"tp":"szam","t":"mc","q":"Hogyan írod le Pythonban a „két és fél” számot?","o":["2.5","2,5","2½","\"2.5\""],"a":0,"why":"Tizedesvessző helyett tizedespontot írunk. A \"2.5\" már szöveg lenne.","id":"fdf02112"},{"ch":3,"tp":"szam","t":"mc","q":"Pénzösszegeknél mi a biztonságos megoldás a kerekítési hibák ellen?","o":["Egész számban számolni (pl. fillérben)","Mindig float-ot használni","Szövegként tárolni és összeadni","Az == jellel ellenőrizni"],"a":0,"why":"Az egész számok pontosak; fillérben számolva nincs kerekítési hiba.","id":"56e6075f"},{"ch":3,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"nagykoru = 20 >= 18\nprint(nagykoru)","o":["True","20","False","Hiba"],"a":0,"why":"Az összehasonlítás eredményét (True) eltároltuk egy változóban.","id":"4eece342"},{"ch":3,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"print(bool(0), bool(7))","o":["False True","True True","0 7","False False"],"a":0,"why":"A nulla hamisnak számít, minden más szám igaznak.","id":"d200f6c5"},{"ch":3,"tp":"logikai","t":"out","q":"Mit ír ki?","code":"print(bool(\"\"), bool(\"szia\"))","o":["False True","True True","True False","\"\" szia"],"a":0,"why":"Az üres szöveg hamis, a nem üres igaz.","id":"cf7a0c45"},{"ch":3,"tp":"logikai","t":"mc","q":"Melyik logikai változónév a legjobb?","o":["van_jegye","x","adat1","valtozo"],"a":0,"why":"Kérdésként olvasható: if van_jegye: – szinte hétköznapi mondat.","id":"3e6a9f04"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"print(\"5\" + \"5\")","o":["55","10","\"55\"","Hiba"],"a":0,"why":"Két szöveg + jellel egymás mellé kerül (összefűzés).","id":"e81c29cc"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"print(5 + 5)","o":["10","55","5 5","Hiba"],"a":0,"why":"Két szám összeadása.","id":"5b884550"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"print(\"ha\" * 3)","o":["hahaha","ha3","ha ha ha","Hiba"],"a":0,"why":"Szöveg szorozva számmal = ismétlés.","id":"516b097c"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"print(len(\"Kovács\"))","o":["6","5","7","Kovács"],"a":0,"why":"A len() a karakterek számát adja: K-o-v-á-c-s = 6.","id":"4eff1d4d"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"szo = \"PROGRAM\"\nprint(szo[0])","o":["P","R","M","Hiba"],"a":0,"why":"Az első karakter indexe 0.","id":"8cae5bb7"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"szo = \"PROGRAM\"\nprint(szo[3])","o":["G","O","R","P"],"a":0,"why":"P=0, R=1, O=2, G=3.","id":"f3ec7710"},{"ch":3,"tp":"szoveg","t":"out","q":"Mit ír ki?","code":"szo = \"PROGRAM\"\nprint(szo[-1])","o":["M","A","P","Hiba"],"a":0,"why":"A -1 az utolsó karakter.","id":"0ad0a48e"},{"ch":3,"tp":"szoveg",
